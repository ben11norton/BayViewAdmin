<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bayview Laundry — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #F0F2F7;
      --surface:      #FFFFFF;
      --surface2:     #F7F8FC;
      --surface3:     #EEF0F6;
      --border:       rgba(0,0,0,0.07);
      --border2:      rgba(0,0,0,0.04);
      --shadow:       0 2px 12px rgba(0,0,0,0.07), 0 1px 3px rgba(0,0,0,0.05);
      --shadow-lg:    0 8px 32px rgba(0,0,0,0.10), 0 2px 8px rgba(0,0,0,0.06);
      --green:        #00A878;
      --green-dim:    rgba(0,168,120,0.08);
      --green-border: rgba(0,168,120,0.22);
      --blue:         #2C6EE8;
      --blue-dim:     rgba(44,110,232,0.08);
      --amber:        #D97706;
      --amber-dim:    rgba(217,119,6,0.08);
      --red:          #E8354A;
      --red-dim:      rgba(232,53,74,0.07);
      --purple:       #7C3AED;
      --purple-dim:   rgba(124,58,237,0.08);
      --text:         #141820;
      --text-mid:     #4A5468;
      --text-dim:     #9AA3B5;
      --mono:         'IBM Plex Mono', monospace;
      --sans:         'Space Grotesk', sans-serif;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); }
    #root { min-height: 100vh; display: flex; flex-direction: column; }

    /* ── Header ── */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 32px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .logo-mark {
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      position: relative;
    }
    .logo-mark canvas {
      position: relative; z-index: 1;
      filter: drop-shadow(0 6px 8px rgba(20,24,32,0.28)) drop-shadow(0 2px 3px rgba(20,24,32,0.18));
    }
    .header-title { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; color: var(--text); }
    .header-sub { font-size: 11px; color: var(--text-mid); margin-top: 1px; }
    .admin-badge {
      padding: 4px 10px; border-radius: 20px;
      background: var(--green-dim); border: 1px solid var(--green-border);
      font-size: 11px; font-weight: 600; color: var(--green);
      font-family: var(--mono); letter-spacing: 0.06em; text-transform: uppercase;
    }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .last-sync {
      font-family: var(--mono); font-size: 11px; color: var(--text-dim);
    }
    .refresh-btn {
      width: 32px; height: 32px; border-radius: 9px;
      background: var(--surface2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text-mid); transition: color 0.15s, background 0.15s;
    }
    .refresh-btn:hover { color: var(--green); background: var(--surface3); }
    .refresh-btn svg { width: 15px; height: 15px; }
    .refresh-btn.spinning svg { animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Layout ── */
    .main {
      flex: 1; padding: 32px;
      max-width: 1080px; width: 100%; margin: 0 auto;
      display: flex; flex-direction: column; gap: 32px;
    }

    .section-eyebrow {
      font-size: 11px; font-weight: 600; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--text-dim); margin-bottom: 14px;
    }

    /* ── Stat cards row ── */
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }

    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 22px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .stat-label {
      font-size: 11px; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--text-mid);
    }
    .stat-value {
      font-family: var(--mono); font-size: 36px; font-weight: 500;
      letter-spacing: -2px; line-height: 1; color: var(--text);
    }
    .stat-sub { font-size: 12px; color: var(--text-dim); }
    .stat-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 600; font-family: var(--mono);
      padding: 3px 8px; border-radius: 6px; width: fit-content;
    }
    .stat-badge.green { background: var(--green-dim); color: var(--green); }
    .stat-badge.blue  { background: var(--blue-dim);  color: var(--blue); }
    .stat-badge.amber { background: var(--amber-dim); color: var(--amber); }
    .stat-badge.purple{ background: var(--blue-dim);  color: var(--blue);  }

    /* ── Two-column middle row ── */
    .mid-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    /* ── Panel ── */
    .panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 24px;
    }
    .panel-title {
      font-size: 14px; font-weight: 700; color: var(--text);
      margin-bottom: 20px; letter-spacing: -0.2px;
    }

    /* ── Bar chart ── */
    .bar-chart { display: flex; flex-direction: column; gap: 10px; }
    .bar-row { display: flex; align-items: center; gap: 12px; }
    .bar-day {
      font-family: var(--mono); font-size: 11px; color: var(--text-mid);
      width: 36px; flex-shrink: 0; text-align: right;
    }
    .bar-track {
      flex: 1; height: 8px; background: var(--surface3);
      border-radius: 99px; overflow: hidden;
    }
    .bar-fill {
      height: 100%; border-radius: 99px;
      background: linear-gradient(90deg, #00A878, #00C48C);
      transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .bar-val {
      font-family: var(--mono); font-size: 11px; color: var(--text-dim);
      width: 24px; text-align: right; flex-shrink: 0;
    }

    /* ── Hourly heatmap ── */
    .heatmap { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; }
    .heat-cell {
      aspect-ratio: 1; border-radius: 4px;
      background: var(--surface3);
    }
    .heatmap-labels {
      display: grid; grid-template-columns: repeat(24, 1fr);
      margin-top: 4px;
    }
    .heat-label {
      font-family: var(--mono); font-size: 9px; color: var(--text-dim);
      text-align: center;
    }

    /* ── Feedback list ── */
    .feedback-list { display: flex; flex-direction: column; gap: 12px; }
    .feedback-item {
      background: var(--surface2); border: 1px solid var(--border2);
      border-radius: 14px; padding: 16px;
    }
    .feedback-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .feedback-stars-display { font-size: 13px; letter-spacing: 1px; }
    .feedback-meta {
      font-family: var(--mono); font-size: 11px; color: var(--text-dim);
    }
    .feedback-message { font-size: 13px; color: var(--text-mid); line-height: 1.5; }
    .feedback-no-msg { font-size: 12px; color: var(--text-dim); font-style: italic; }

    .empty-state {
      text-align: center; padding: 40px 20px;
      color: var(--text-dim); font-size: 13px;
    }
    .empty-icon { font-size: 28px; margin-bottom: 8px; }

    /* ── Rating breakdown ── */
    .rating-bars { display: flex; flex-direction: column; gap: 8px; }
    .rating-row { display: flex; align-items: center; gap: 10px; }
    .rating-label { font-size: 13px; flex-shrink: 0; }
    .rating-track { flex: 1; height: 8px; background: var(--surface3); border-radius: 99px; overflow: hidden; }
    .rating-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--amber), #F7C948); transition: width 0.6s ease; }
    .rating-count { font-family: var(--mono); font-size: 11px; color: var(--text-dim); width: 20px; text-align: right; flex-shrink: 0; }

    /* ── Avg score display ── */
    .avg-score-wrap { text-align: center; margin-bottom: 20px; }
    .avg-score-num { font-family: var(--mono); font-size: 48px; font-weight: 500; letter-spacing: -3px; color: var(--amber); line-height: 1; }
    .avg-score-stars { font-size: 18px; margin: 4px 0; }
    .avg-score-sub { font-size: 12px; color: var(--text-dim); }

    .loading-screen {
      flex: 1; display: flex; align-items: center; justify-content: center;
      gap: 10px; color: var(--text-dim); font-size: 14px;
    }
    .spinner {
      width: 18px; height: 18px; border: 2px solid var(--border);
      border-top-color: var(--green); border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    /* ── 3D Scene panel ── */
    .scene-panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; overflow: hidden; position: relative;
      width: 100%; height: 560px;
    }
    .scene-canvas {
      width: 100%; height: 100%; display: block;
    }
    .scene-legend {
      position: absolute; bottom: 16px; left: 20px;
      display: flex; gap: 16px; align-items: center;
    }
    .legend-item {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 600; color: var(--text-mid);
      font-family: var(--mono); letter-spacing: 0.04em;
    }
    .legend-dot {
      width: 10px; height: 10px; border-radius: 50%;
    }
    .scene-title {
      position: absolute; top: 16px; left: 20px;
      font-size: 14px; font-weight: 700; color: var(--text);
      letter-spacing: -0.2px;
    }
    .scene-subtitle {
      position: absolute; top: 38px; left: 20px;
      font-size: 11px; color: var(--text-dim); font-family: var(--mono);
    }

    /* ── Mini floating machine cards (glassmorphic) ── */
    .mini-card {
      position: absolute; transform: translate(-50%, -100%);
      pointer-events: none; z-index: 5;
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(10px) saturate(160%);
      -webkit-backdrop-filter: blur(10px) saturate(160%);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 10px;
      padding: 6px 9px;
      box-shadow: 0 4px 14px rgba(20,24,32,0.10), 0 1px 3px rgba(20,24,32,0.06);
      min-width: 76px;
      transition: left 0.05s linear, top 0.05s linear;
    }
    .mini-card-row {
      display: flex; align-items: center; gap: 5px;
      white-space: nowrap;
    }
    .mini-card-dot {
      width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
    }
    .mini-card-label {
      font-family: var(--mono); font-size: 9px; font-weight: 600;
      color: var(--text); letter-spacing: 0.02em;
    }
    .mini-card-status {
      font-family: var(--sans); font-size: 9px; font-weight: 600;
      margin-left: auto; padding-left: 6px;
    }
    .mini-card-timer {
      font-family: var(--mono); font-size: 11px; font-weight: 600;
      margin-top: 2px; letter-spacing: -0.2px;
    }
    .mini-card.mini-available .mini-card-dot { background: var(--green); }
    .mini-card.mini-available .mini-card-status { color: var(--green); }
    .mini-card.mini-inuse .mini-card-dot { background: var(--red); animation: blink 1.2s ease-in-out infinite; }
    .mini-card.mini-inuse .mini-card-status { color: var(--red); }
    .mini-card.mini-inuse .mini-card-timer { color: var(--red); }
    .mini-card.mini-ooo .mini-card-dot { background: var(--amber); }
    .mini-card.mini-ooo .mini-card-status { color: var(--amber); }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.25;} }

    @media (max-width: 760px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .mid-row { grid-template-columns: 1fr; }
      .main { padding: 16px; gap: 20px; }
      .header { padding: 16px; }
      .scene-panel { height: 420px; }
    }
    @media (max-width: 480px) {
      .scene-panel { height: 360px; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCsh-8p7ITozw-E1fbezr9ORMBXK-coDR8",
  authDomain: "bayview-laundry.firebaseapp.com",
  databaseURL: "https://bayview-laundry-default-rtdb.firebaseio.com",
  projectId: "bayview-laundry",
  storageBucket: "bayview-laundry.firebasestorage.app",
  messagingSenderId: "204674191712",
  appId: "1:204674191712:web:f46ffa5b31e4c843198e05"
};

let fbDb, fbGet, fbRef;

async function initFirebase() {
  const { initializeApp, getApps } = await import("https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js");
  const db = await import("https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js");
  const apps = getApps();
  const app = apps.length ? apps[0] : initializeApp(FIREBASE_CONFIG);
  fbDb  = db.getDatabase(app);
  fbGet = db.get;
  fbRef = db.ref;
}

function getTodayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function getLast7Days() {
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const label = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric' });
    days.push({ key, label });
  }
  return days;
}

function fmtDate(ts) {
  return new Date(ts).toLocaleString('en-GB', {
    day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
  });
}

function starStr(n) {
  if (!n) return '—';
  return '★'.repeat(n) + '☆'.repeat(5 - n);
}

function avgRating(feedbacks) {
  const rated = feedbacks.filter(f => f.rating > 0);
  if (!rated.length) return null;
  return (rated.reduce((a, b) => a + b.rating, 0) / rated.length).toFixed(1);
}

// ── 3D Laundry Room Scene ──
function LaundryScene({ machineState }) {
  const mountRef = React.useRef(null);
  const sceneRef = React.useRef({});
  const [cardPositions, setCardPositions] = useState({});

  // Machine layout: [id, col, row]  — two washers top, two dryers bottom
  const LAYOUT = [
    { id: 'wm1', label: 'WM1', col: 0, row: 0 },
    { id: 'wm2', label: 'WM2', col: 1, row: 0 },
    { id: 'td1', label: 'TD1', col: 0, row: 1 },
    { id: 'td2', label: 'TD2', col: 1, row: 1 },
  ];

  const STATUS_COLORS = {
    available:    0x00A878,
    'in-use':     0xE8354A,
    'out-of-order': 0xD97706,
  };
  const GLOW_COLORS = {
    available:    0x00C48C,
    'in-use':     0xFF4560,
    'out-of-order': 0xF5A623,
  };

  function getStatus(id) {
    if (!machineState || !machineState[id]) return 'available';
    const d = machineState[id];
    if (d.status === 'out-of-order') return 'out-of-order';
    if (d.status === 'in-use' && d.endsAt && d.endsAt > Date.now()) return 'in-use';
    return 'available';
  }

  useEffect(() => {
    const el = mountRef.current;
    if (!el) return;
    const THREE = window.THREE;

    // Guard against a zero-size mount (can happen on first mobile layout pass)
    const getSize = () => {
      const w = el.clientWidth  || el.parentElement?.clientWidth  || 320;
      const h = el.clientHeight || el.parentElement?.clientHeight || 360;
      return { w, h };
    };
    const { w: W, h: H } = getSize();

    // ── Renderer ──
    const renderer = new THREE.WebGLRenderer({ canvas: el, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(W, H, false);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setClearColor(0xFFFFFF, 0);

    // ── Scene ──
    const scene = new THREE.Scene();

    // ── Isometric camera ──
    const aspect = W / H;
    const d = 6.2;
    const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 0.1, 100);
    // Orbit the camera around the room by 45° so we look down the aisle
    // instead of from the corner, while keeping the same isometric angle/distance
    const camRadius = Math.sqrt(8*8 + 8*8);
    const camAngle  = Math.PI / 4; // rotate 45°
    camera.position.set(camRadius * Math.sin(camAngle), 10, camRadius * Math.cos(camAngle));
    camera.lookAt(0, 0, 0);

    // ── Lights ──
    const ambient = new THREE.AmbientLight(0xffffff, 0.55);
    scene.add(ambient);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(6, 12, 8);
    dirLight.castShadow = true;
    dirLight.shadow.camera.near = 0.1;
    dirLight.shadow.camera.far = 60;
    dirLight.shadow.camera.left = -10;
    dirLight.shadow.camera.right = 10;
    dirLight.shadow.camera.top = 10;
    dirLight.shadow.camera.bottom = -10;
    dirLight.shadow.mapSize.set(1024, 1024);
    scene.add(dirLight);

    const fillLight = new THREE.DirectionalLight(0xdde8ff, 0.3);
    fillLight.position.set(-5, 5, -5);
    scene.add(fillLight);

    // ── Floor ──
    const floorGeo = new THREE.PlaneGeometry(7, 6.6);
    const floorMat = new THREE.MeshLambertMaterial({ color: 0xF0F2F7 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(0.5, 0, 0.2);
    floor.receiveShadow = true;
    scene.add(floor);

    // Floor tile grid lines
    const tileSize = 0.9;
    const lineMat = new THREE.LineBasicMaterial({ color: 0xDDE0EB, transparent: true, opacity: 0.6 });
    for (let x = -3; x <= 4; x++) {
      const geo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(x * tileSize, 0.002, -3.2),
        new THREE.Vector3(x * tileSize, 0.002,  3.6),
      ]);
      scene.add(new THREE.Line(geo, lineMat));
    }
    for (let z = -4; z <= 4; z++) {
      const geo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(-3.0, 0.002, z * tileSize),
        new THREE.Vector3( 4.0, 0.002, z * tileSize),
      ]);
      scene.add(new THREE.Line(geo, lineMat));
    }

    // ── Back walls ──
    const wallMat = new THREE.MeshLambertMaterial({ color: 0xE8EAF0 });
    // back wall
    const backWall = new THREE.Mesh(new THREE.BoxGeometry(7, 2.2, 0.12), wallMat);
    backWall.position.set(0.5, 1.1, -3.25);
    backWall.receiveShadow = true;
    scene.add(backWall);
    // left wall
    const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.12, 2.2, 6.8), wallMat);
    leftWall.position.set(-3.0, 1.1, 0.2);
    leftWall.receiveShadow = true;
    scene.add(leftWall);

    // ── Skirting boards ──
    const skirtMat = new THREE.MeshLambertMaterial({ color: 0xD0D4E0 });
    const skirtBack = new THREE.Mesh(new THREE.BoxGeometry(7, 0.12, 0.12), skirtMat);
    skirtBack.position.set(0.5, 0.06, -3.19);
    scene.add(skirtBack);
    const skirtLeft = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 6.8), skirtMat);
    skirtLeft.position.set(-2.94, 0.06, 0.2);
    scene.add(skirtLeft);

    // ── Laundry basket (decorative) ──
    const basketMat = new THREE.MeshLambertMaterial({ color: 0xC8CEDC });
    const basket = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.22, 0.52, 12), basketMat);
    basket.position.set(2.5, 0.26, 2.7);
    basket.castShadow = true;
    scene.add(basket);
    // basket rim
    const rimMat = new THREE.MeshLambertMaterial({ color: 0xB0B8CC });
    const rim = new THREE.Mesh(new THREE.TorusGeometry(0.28, 0.025, 6, 18), rimMat);
    rim.rotation.x = Math.PI / 2;
    rim.position.set(2.5, 0.52, 2.7);
    scene.add(rim);

    // ── Detergent bottles ──
    const detMat = new THREE.MeshLambertMaterial({ color: 0x00A878 });
    const det1 = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.35, 8), detMat);
    det1.position.set(-2.5, 0.175, -2.8);
    det1.castShadow = true;
    scene.add(det1);
    const detLidMat = new THREE.MeshLambertMaterial({ color: 0x007A58 });
    const detLid = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.09, 0.06, 8), detLidMat);
    detLid.position.set(-2.5, 0.38, -2.8);
    scene.add(detLid);
    const det2 = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.28, 8),
      new THREE.MeshLambertMaterial({ color: 0x4F8EF7 }));
    det2.position.set(-2.28, 0.14, -2.8);
    det2.castShadow = true;
    scene.add(det2);

    // ── Build machines ──
    const machines = {};

    LAYOUT.forEach(({ id, col, row }) => {
      const status = getStatus(id);
      const color  = STATUS_COLORS[status];
      const group  = new THREE.Group();

      // Position: washers near back wall (z=-1.8), dryers pushed toward front edge (z=2.7)
      const x = col === 0 ? -1.1 : 1.1;
      const z = row === 0 ? -1.8 :  2.7;
      group.position.set(x, 0, z);
      // Dryers face the washers (rotate 180°)
      if (row === 1) group.rotation.y = Math.PI;

      // Body
      const bodyMat = new THREE.MeshLambertMaterial({ color: 0xF7F8FC });
      const body = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.0, 1.2), bodyMat);
      body.position.y = 0.5;
      body.castShadow = true;
      body.receiveShadow = true;
      group.add(body);

      // Top panel (slightly darker)
      const topMat = new THREE.MeshLambertMaterial({ color: 0xECEEF5 });
      const top = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.06, 1.2), topMat);
      top.position.y = 1.03;
      group.add(top);

      // Front face colour strip
      const stripMat = new THREE.MeshLambertMaterial({ color });
      const strip = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.07, 0.02), stripMat);
      strip.position.set(0, 0.97, 0.61);
      group.add(strip);

      // Door porthole (circle approximated by cylinder)
      const doorRingMat = new THREE.MeshLambertMaterial({ color: 0xD0D4DF });
      const doorRing = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.04, 24), doorRingMat);
      doorRing.rotation.x = Math.PI / 2;
      doorRing.position.set(0, 0.48, 0.62);
      group.add(doorRing);

      // Drum (inner spinning part)
      const drumMat = new THREE.MeshLambertMaterial({ color: 0xB8BDD0 });
      const drum = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.05, 20), drumMat);
      drum.rotation.x = Math.PI / 2;
      drum.position.set(0, 0.48, 0.635);
      group.add(drum);

      // Drum inner glow disc
      const glowMat = new THREE.MeshLambertMaterial({ color: GLOW_COLORS[status], transparent: true, opacity: status === 'available' ? 0.35 : 0.75 });
      const glowDisc = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.01, 20), glowMat);
      glowDisc.rotation.x = Math.PI / 2;
      glowDisc.position.set(0, 0.48, 0.645);
      group.add(glowDisc);

      // Control panel buttons (top right of front face)
      const btnColors = [0x00A878, 0x4F8EF7, 0xD97706];
      btnColors.forEach((bc, bi) => {
        const btn = new THREE.Mesh(
          new THREE.CylinderGeometry(0.04, 0.04, 0.02, 8),
          new THREE.MeshLambertMaterial({ color: bc })
        );
        btn.rotation.x = Math.PI / 2;
        btn.position.set(0.42 - bi * 0.14, 0.78, 0.615);
        group.add(btn);
      });

      // Status indicator LED
      const ledMat = new THREE.MeshLambertMaterial({ color: GLOW_COLORS[status], emissive: GLOW_COLORS[status], emissiveIntensity: 0.8 });
      const led = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 8), ledMat);
      led.position.set(-0.45, 0.82, 0.615);
      group.add(led);

      // Point light for glow effect
      const pointLight = new THREE.PointLight(GLOW_COLORS[status], status === 'in-use' ? 0.8 : 0.2, 2.5);
      pointLight.position.set(0, 0.5, 0.8);
      group.add(pointLight);

      // Anchor point above the machine for the floating status card
      const cardAnchor = new THREE.Object3D();
      cardAnchor.position.set(0, 1.55, 0);
      group.add(cardAnchor);

      scene.add(group);
      machines[id] = { group, drum, glowDisc, led, ledMat, glowMat, stripMat, strip, pointLight, status, cardAnchor };
    });

    // Store refs
    sceneRef.current = { renderer, scene, camera, machines };

    // ── Animation loop ──
    let frameId;
    let t = 0;
    let lastProjUpdate = 0;
    function animate() {
      frameId = requestAnimationFrame(animate);
      t += 0.016;

      Object.entries(machines).forEach(([id, m]) => {
        if (m.status === 'in-use') {
          // Spin drum
          m.drum.rotation.z += 0.04;
          m.glowDisc.rotation.z += 0.04;
          // Pulse point light
          m.pointLight.intensity = 0.6 + Math.sin(t * 3) * 0.3;
          // Pulse LED
          m.ledMat.emissiveIntensity = 0.6 + Math.sin(t * 4) * 0.4;
        } else if (m.status === 'out-of-order') {
          // Slow amber pulse
          m.pointLight.intensity = 0.15 + Math.sin(t * 1.5) * 0.1;
          m.ledMat.emissiveIntensity = 0.4 + Math.sin(t * 2) * 0.3;
        }
      });

      renderer.render(scene, camera);

      // Project card anchors to screen space (throttled to ~20fps for perf)
      if (t - lastProjUpdate > 0.05) {
        lastProjUpdate = t;
        const rect = el.getBoundingClientRect();
        const positions = {};
        Object.entries(machines).forEach(([id, m]) => {
          const worldPos = new THREE.Vector3();
          m.cardAnchor.getWorldPosition(worldPos);
          const projected = worldPos.clone().project(camera);
          positions[id] = {
            x: (projected.x * 0.5 + 0.5) * rect.width,
            y: (-projected.y * 0.5 + 0.5) * rect.height,
          };
        });
        setCardPositions(positions);
      }
    }
    animate();

    // Resize handler — ResizeObserver catches container size changes
    // (orientation change, breakpoint shifts, card resize) more reliably than
    // window resize alone, which can miss layout shifts on mobile.
    function onResize() {
      const { w, h } = getSize();
      if (w === 0 || h === 0) return;
      const asp = w / h;
      camera.left = -d * asp; camera.right = d * asp;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
    }
    const resizeObserver = new ResizeObserver(onResize);
    resizeObserver.observe(el);
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', onResize);
    // Re-check shortly after mount in case the initial layout pass raced us
    const settleTimer = setTimeout(onResize, 150);

    return () => {
      cancelAnimationFrame(frameId);
      clearTimeout(settleTimer);
      resizeObserver.disconnect();
      window.removeEventListener('resize', onResize);
      window.removeEventListener('orientationchange', onResize);
      renderer.dispose();
    };
  }, []); // mount once

  // Update machine colours/status reactively without rebuilding scene
  useEffect(() => {
    const { machines } = sceneRef.current;
    if (!machines) return;
    LAYOUT.forEach(({ id }) => {
      const m = machines[id];
      if (!m) return;
      const status = getStatus(id);
      if (status === m.status) return;
      m.status = status;
      const col  = STATUS_COLORS[status];
      const glow = GLOW_COLORS[status];
      m.stripMat.color.setHex(col);
      m.glowMat.color.setHex(glow);
      m.glowMat.opacity = status === 'available' ? 0.35 : 0.75;
      m.ledMat.color.setHex(glow);
      m.ledMat.emissive.setHex(glow);
      m.pointLight.color.setHex(glow);
      m.pointLight.intensity = status === 'in-use' ? 0.8 : 0.2;
    });
  }, [machineState]);

  return (
    <div className="scene-panel">
      <canvas className="scene-canvas" ref={mountRef}/>
      <div className="scene-title">Laundry Room</div>
      <div className="scene-subtitle">Live view · read-only</div>
      {LAYOUT.map(({ id, label }) => (
        <MiniMachineCard
          key={id}
          label={label}
          status={getStatus(id)}
          data={machineState?.[id]}
          pos={cardPositions[id]}
        />
      ))}
      <div className="scene-legend">
        <div className="legend-item"><div className="legend-dot" style={{background:'#00A878'}}/> Free</div>
        <div className="legend-item"><div className="legend-dot" style={{background:'#E8354A'}}/> In use</div>
        <div className="legend-item"><div className="legend-dot" style={{background:'#D97706'}}/> Out of order</div>
      </div>
    </div>
  );
}

// ── Mini floating status card (glassmorphic, mirrors the laundry app cards) ──
function MiniMachineCard({ label, status, data, pos }) {
  const [now, setNow] = useState(Date.now());
  useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);

  if (!pos) return null;

  const remaining = data?.endsAt ? Math.max(0, data.endsAt - now) : 0;
  const fmtTime = ms => {
    if (ms <= 0) return '0:00';
    const s = Math.ceil(ms / 1000);
    return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  };

  const STATUS_META = {
    available:     { text: 'Free',         cls: 'mini-available' },
    'in-use':      { text: 'In Use',       cls: 'mini-inuse' },
    'out-of-order':{ text: 'Out of Order', cls: 'mini-ooo' },
  };
  const meta = STATUS_META[status];

  return (
    <div
      className={`mini-card ${meta.cls}`}
      style={{ left: pos.x, top: pos.y }}
    >
      <div className="mini-card-row">
        <span className="mini-card-dot"/>
        <span className="mini-card-label">{label}</span>
        <span className="mini-card-status">{meta.text}</span>
      </div>
      {status === 'in-use' && (
        <div className="mini-card-timer">{fmtTime(remaining)}</div>
      )}
    </div>
  );
}

// ── Mini 3D washing machine icon for the header ──
// Exact replica of the washer model + camera angle used in the room scene below, static (no spin).
function HeaderMachineIcon() {
  const mountRef = React.useRef(null);

  useEffect(() => {
    const el = mountRef.current;
    if (!el) return;
    const THREE = window.THREE;
    const SIZE = 52;

    const renderer = new THREE.WebGLRenderer({ canvas: el, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(SIZE, SIZE, false);
    renderer.setClearColor(0xFFFFFF, 0);

    const scene = new THREE.Scene();

    // Same isometric angle as the room scene (camera at (8,10,8) orbited 45°),
    // just framed tightly on a single machine.
    const d = 1.05;
    const camera = new THREE.OrthographicCamera(-d, d, d, -d, 0.1, 20);
    const camRadius = Math.sqrt(8*8 + 8*8);
    const camAngle  = Math.PI / 4;
    const dir = new THREE.Vector3(Math.sin(camAngle), 10 / camRadius, Math.cos(camAngle)).normalize();
    camera.position.set(dir.x * 2.6, dir.y * 2.6, dir.z * 2.6);
    camera.lookAt(0, 0.4, 0);

    const ambient = new THREE.AmbientLight(0xffffff, 0.55);
    scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(6, 12, 8);
    scene.add(dirLight);
    const fillLight = new THREE.DirectionalLight(0xdde8ff, 0.3);
    fillLight.position.set(-5, 5, -5);
    scene.add(fillLight);

    // ── Exact replica of the room-scene washer (status: available / green) ──
    const group = new THREE.Group();
    scene.add(group);

    const bodyMat = new THREE.MeshLambertMaterial({ color: 0xF7F8FC });
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.0, 1.2), bodyMat);
    body.position.y = 0.5;
    group.add(body);

    const topMat = new THREE.MeshLambertMaterial({ color: 0xECEEF5 });
    const top = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.06, 1.2), topMat);
    top.position.y = 1.03;
    group.add(top);

    const stripMat = new THREE.MeshLambertMaterial({ color: 0x00A878 });
    const strip = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.07, 0.02), stripMat);
    strip.position.set(0, 0.97, 0.61);
    group.add(strip);

    const doorRingMat = new THREE.MeshLambertMaterial({ color: 0xD0D4DF });
    const doorRing = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.04, 24), doorRingMat);
    doorRing.rotation.x = Math.PI / 2;
    doorRing.position.set(0, 0.48, 0.62);
    group.add(doorRing);

    const drumMat = new THREE.MeshLambertMaterial({ color: 0xB8BDD0 });
    const drum = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.05, 20), drumMat);
    drum.rotation.x = Math.PI / 2;
    drum.position.set(0, 0.48, 0.635);
    group.add(drum);

    const glowMat = new THREE.MeshLambertMaterial({ color: 0x00C48C, transparent: true, opacity: 0.35 });
    const glowDisc = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.01, 20), glowMat);
    glowDisc.rotation.x = Math.PI / 2;
    glowDisc.position.set(0, 0.48, 0.645);
    group.add(glowDisc);

    const btnColors = [0x00A878, 0x4F8EF7, 0xD97706];
    btnColors.forEach((bc, bi) => {
      const btn = new THREE.Mesh(
        new THREE.CylinderGeometry(0.04, 0.04, 0.02, 8),
        new THREE.MeshLambertMaterial({ color: bc })
      );
      btn.rotation.x = Math.PI / 2;
      btn.position.set(0.42 - bi * 0.14, 0.78, 0.615);
      group.add(btn);
    });

    const ledMat = new THREE.MeshLambertMaterial({ color: 0x00C48C, emissive: 0x00C48C, emissiveIntensity: 0.8 });
    const led = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 8), ledMat);
    led.position.set(-0.45, 0.82, 0.615);
    group.add(led);

    // Static render — single frame, no animation loop needed
    renderer.render(scene, camera);

    return () => {
      renderer.dispose();
    };
  }, []);

  return (
    <div className="logo-mark">
      <canvas ref={mountRef} style={{ width: 52, height: 52, display: 'block' }}/>
    </div>
  );
}

// ── Main dashboard ──
function Dashboard() {
  const [data,      setData]      = useState(null);
  const [loading,   setLoading]   = useState(true);
  const [spinning,  setSpinning]  = useState(false);
  const [lastSync,  setLastSync]  = useState(null);

  const load = useCallback(async () => {
    setSpinning(true);
    try {
      const [totalsSnap, dailySnap, hourlySnap, feedbackSnap, machinesSnap] = await Promise.all([
        fbGet(fbRef(fbDb, 'analytics/totals')),
        fbGet(fbRef(fbDb, 'analytics/daily')),
        fbGet(fbRef(fbDb, `analytics/hourly/${getTodayKey()}`)),
        fbGet(fbRef(fbDb, 'feedback')),
        fbGet(fbRef(fbDb, 'machines')),
      ]);

      const totals   = totalsSnap.exists()   ? totalsSnap.val()   : {};
      const daily    = dailySnap.exists()    ? dailySnap.val()    : {};
      const hourly   = hourlySnap.exists()   ? hourlySnap.val()   : {};
      const rawFB    = feedbackSnap.exists() ? feedbackSnap.val() : {};
      const machines = machinesSnap.exists() ? machinesSnap.val() : {};

      const feedbacks = Object.values(rawFB).sort((a, b) => b.ts - a.ts);

      setData({ totals, daily, hourly, feedbacks, machines });
      setLastSync(Date.now());
    } catch(e) {
      console.error(e);
    } finally {
      setLoading(false);
      setSpinning(false);
    }
  }, []);

  useEffect(() => { load(); }, [load]);

  if (loading) return (
    <div className="loading-screen"><div className="spinner"/><span>Loading dashboard…</span></div>
  );

  const { totals, daily, hourly, feedbacks, machines } = data || {};
  const days7  = getLast7Days();
  // Bar chart sized against uniqueUsers
  const maxDay = Math.max(1, ...days7.map(d => daily?.[d.key]?.uniqueUsers || 0));

  const maxHour = Math.max(1, ...Array.from({length:24}, (_,i) => hourly?.[`h${i}`] || 0));

  const ratingCounts = [5,4,3,2,1].map(r => ({
    r,
    count: feedbacks.filter(f => f.rating === r).length
  }));
  const maxRatingCount = Math.max(1, ...ratingCounts.map(x => x.count));
  const avg = avgRating(feedbacks);

  // Unique users instead of raw visits
  const todayVisits  = daily?.[getTodayKey()]?.uniqueUsers || 0;
  const todayCycles  = daily?.[getTodayKey()]?.cycles      || 0;
  const totalVisits  = totals?.uniqueUsers || 0;
  const totalCycles  = totals?.cycles      || 0;

  const syncStr = lastSync
    ? new Date(lastSync).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
    : '—';

  return (
    <>
      <div className="header">
        <div className="header-left">
          <HeaderMachineIcon/>
          <div>
            <div className="header-title">Bayview Laundry</div>
            <div className="header-sub">Admin dashboard</div>
          </div>
        </div>
        <div className="header-right">
          <span className="last-sync">Synced {syncStr}</span>
          <div
            className={`refresh-btn ${spinning ? 'spinning' : ''}`}
            onClick={load}
            title="Refresh"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <polyline points="23 4 23 10 17 10"/>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
          </div>
        </div>
      </div>

      <div className="main">

        {/* ── 3D Scene ── */}
        <div>
          <div className="section-eyebrow">Live room view</div>
          <LaundryScene machineState={machines}/>
        </div>

        {/* ── Stats row ── */}
        <div>
          <div className="section-eyebrow">Overview</div>
          <div className="stats-grid">
            <div className="stat-card">
              <div className="stat-label">Total visits</div>
              <div className="stat-value">{totalVisits}</div>
              <div className="stat-badge green">↑ All time</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Today's visits</div>
              <div className="stat-value">{todayVisits}</div>
              <div className="stat-badge blue">Today</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Cycles started</div>
              <div className="stat-value">{totalCycles}</div>
              <div className="stat-badge amber">All time</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Feedback items</div>
              <div className="stat-value">{feedbacks.length}</div>
              <div className="stat-badge purple">Received</div>
            </div>
          </div>
        </div>

        {/* ── Mid row: 7-day + today's heatmap ── */}
        <div className="mid-row">
          <div className="panel">
            <div className="panel-title">Visits — last 7 days</div>
            <div className="bar-chart">
              {days7.map(({ key, label }) => {
                const v = daily?.[key]?.uniqueUsers || 0;
                const pct = (v / maxDay) * 100;
                return (
                  <div className="bar-row" key={key}>
                    <div className="bar-day">{label.split(' ')[0]}</div>
                    <div className="bar-track">
                      <div className="bar-fill" style={{width: `${pct}%`}}/>
                    </div>
                    <div className="bar-val">{v}</div>
                  </div>
                );
              })}
            </div>
          </div>

          <div className="panel">
            <div className="panel-title">Active hours — today</div>
            <div className="heatmap">
              {Array.from({length:24}, (_,i) => {
                const v = hourly?.[`h${i}`] || 0;
                const pct = v / maxHour;
                const alpha = 0.08 + pct * 0.92;
                return (
                  <div
                    key={i}
                    className="heat-cell"
                    title={`${i}:00 — ${v} visit${v!==1?'s':''}`}
                    style={{ background: v > 0 ? `rgba(0,196,140,${alpha.toFixed(2)})` : undefined }}
                  />
                );
              })}
            </div>
            <div className="heatmap-labels">
              {Array.from({length:24}, (_,i) => (
                <div className="heat-label" key={i}>
                  {i % 6 === 0 ? `${i}h` : ''}
                </div>
              ))}
            </div>
            <div style={{marginTop: 20}}>
              <div style={{display:'flex', justifyContent:'space-between', marginBottom: 8}}>
                <span style={{fontSize:12, color:'var(--text-mid)', fontWeight:600}}>Today's cycles</span>
                <span style={{fontFamily:'var(--mono)', fontSize:12, color:'var(--text-dim)'}}>{todayCycles} started</span>
              </div>
              {['washer','dryer'].map(t => {
                const c = daily?.[getTodayKey()]?.[`cycles_${t}`] || 0;
                return (
                  <div className="bar-row" key={t} style={{marginBottom:6}}>
                    <div className="bar-day" style={{width:42}}>{t === 'washer' ? 'Wash' : 'Dry'}</div>
                    <div className="bar-track">
                      <div className="bar-fill" style={{width:`${todayCycles > 0 ? (c/todayCycles)*100 : 0}%`, background:'linear-gradient(90deg,#4F8EF7,#74AAFF)'}}/>
                    </div>
                    <div className="bar-val">{c}</div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>

        {/* ── Feedback row ── */}
        <div className="mid-row">

          {/* Rating summary */}
          <div className="panel">
            <div className="panel-title">Ratings</div>
            {feedbacks.length === 0 ? (
              <div className="empty-state">
                <div className="empty-icon">⭐</div>
                No ratings yet
              </div>
            ) : (
              <>
                <div className="avg-score-wrap">
                  <div className="avg-score-num">{avg || '—'}</div>
                  <div className="avg-score-stars">{avg ? '★'.repeat(Math.round(avg)) + '☆'.repeat(5-Math.round(avg)) : ''}</div>
                  <div className="avg-score-sub">{feedbacks.filter(f=>f.rating>0).length} ratings</div>
                </div>
                <div className="rating-bars">
                  {ratingCounts.map(({r, count}) => (
                    <div className="rating-row" key={r}>
                      <div className="rating-label">{'★'.repeat(r)}</div>
                      <div className="rating-track">
                        <div className="rating-fill" style={{width:`${(count/maxRatingCount)*100}%`}}/>
                      </div>
                      <div className="rating-count">{count}</div>
                    </div>
                  ))}
                </div>
              </>
            )}
          </div>

          {/* Feedback messages */}
          <div className="panel" style={{maxHeight: 480, overflowY: 'auto'}}>
            <div className="panel-title">Feedback messages</div>
            {feedbacks.length === 0 ? (
              <div className="empty-state">
                <div className="empty-icon">💬</div>
                No feedback yet
              </div>
            ) : (
              <div className="feedback-list">
                {feedbacks.map((f, i) => (
                  <div className="feedback-item" key={i}>
                    <div className="feedback-header">
                      <span className="feedback-stars-display">{starStr(f.rating)}</span>
                      <span className="feedback-meta">{fmtDate(f.ts)}</span>
                    </div>
                    {f.message
                      ? <div className="feedback-message">{f.message}</div>
                      : <div className="feedback-no-msg">No message</div>
                    }
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>

      </div>
    </>
  );
}

// ── Root ──
function App() {
  const [fbReady, setFbReady] = useState(false);

  useEffect(() => {
    initFirebase().then(() => setFbReady(true)).catch(console.error);
  }, []);

  if (!fbReady) return <div className="loading-screen"><div className="spinner"/><span>Initialising…</span></div>;
  return <Dashboard />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
