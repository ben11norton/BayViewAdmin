<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bayview Laundry — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #F0F2F7;
      --surface:      #FFFFFF;
      --surface2:     #F7F8FC;
      --surface3:     #EEF0F6;
      --border:       rgba(0,0,0,0.07);
      --border2:      rgba(0,0,0,0.04);
      --shadow:       0 2px 12px rgba(0,0,0,0.07), 0 1px 3px rgba(0,0,0,0.05);
      --shadow-lg:    0 8px 32px rgba(0,0,0,0.10), 0 2px 8px rgba(0,0,0,0.06);
      --green:        #00A878;
      --green-dim:    rgba(0,168,120,0.08);
      --green-border: rgba(0,168,120,0.22);
      --blue:         #2C6EE8;
      --blue-dim:     rgba(44,110,232,0.08);
      --amber:        #D97706;
      --amber-dim:    rgba(217,119,6,0.08);
      --red:          #E8354A;
      --red-dim:      rgba(232,53,74,0.07);
      --purple:       #7C3AED;
      --purple-dim:   rgba(124,58,237,0.08);
      --text:         #141820;
      --text-mid:     #4A5468;
      --text-dim:     #9AA3B5;
      --mono:         'IBM Plex Mono', monospace;
      --sans:         'Space Grotesk', sans-serif;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); }
    #root { min-height: 100vh; display: flex; flex-direction: column; }

    /* ── Header ── */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 32px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .logo-mark {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, #00A878 0%, #00C2A0 100%);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .logo-mark svg { width: 19px; height: 19px; }
    .header-title { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; color: var(--text); }
    .header-sub { font-size: 11px; color: var(--text-mid); margin-top: 1px; }
    .admin-badge {
      padding: 4px 10px; border-radius: 20px;
      background: var(--green-dim); border: 1px solid var(--green-border);
      font-size: 11px; font-weight: 600; color: var(--green);
      font-family: var(--mono); letter-spacing: 0.06em; text-transform: uppercase;
    }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .last-sync {
      font-family: var(--mono); font-size: 11px; color: var(--text-dim);
    }
    .refresh-btn {
      width: 32px; height: 32px; border-radius: 9px;
      background: var(--surface2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text-mid); transition: color 0.15s, background 0.15s;
    }
    .refresh-btn:hover { color: var(--green); background: var(--surface3); }
    .refresh-btn svg { width: 15px; height: 15px; }
    .refresh-btn.spinning svg { animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Layout ── */
    .main {
      flex: 1; padding: 32px;
      max-width: 1080px; width: 100%; margin: 0 auto;
      display: flex; flex-direction: column; gap: 32px;
    }

    .section-eyebrow {
      font-size: 11px; font-weight: 600; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--text-dim); margin-bottom: 14px;
    }

    /* ── Stat cards row ── */
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }

    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 22px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .stat-label {
      font-size: 11px; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--text-mid);
    }
    .stat-value {
      font-family: var(--mono); font-size: 36px; font-weight: 500;
      letter-spacing: -2px; line-height: 1; color: var(--text);
    }
    .stat-sub { font-size: 12px; color: var(--text-dim); }
    .stat-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 600; font-family: var(--mono);
      padding: 3px 8px; border-radius: 6px; width: fit-content;
    }
    .stat-badge.green { background: var(--green-dim); color: var(--green); }
    .stat-badge.blue  { background: var(--blue-dim);  color: var(--blue); }
    .stat-badge.amber { background: var(--amber-dim); color: var(--amber); }
    .stat-badge.purple{ background: var(--blue-dim);  color: var(--blue);  }

    /* ── Two-column middle row ── */
    .mid-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    /* ── Panel ── */
    .panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 24px;
    }
    .panel-title {
      font-size: 14px; font-weight: 700; color: var(--text);
      margin-bottom: 20px; letter-spacing: -0.2px;
    }

    /* ── Bar chart ── */
    .bar-chart { display: flex; flex-direction: column; gap: 10px; }
    .bar-row { display: flex; align-items: center; gap: 12px; }
    .bar-day {
      font-family: var(--mono); font-size: 11px; color: var(--text-mid);
      width: 36px; flex-shrink: 0; text-align: right;
    }
    .bar-track {
      flex: 1; height: 8px; background: var(--surface3);
      border-radius: 99px; overflow: hidden;
    }
    .bar-fill {
      height: 100%; border-radius: 99px;
      background: linear-gradient(90deg, #00A878, #00C48C);
      transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .bar-val {
      font-family: var(--mono); font-size: 11px; color: var(--text-dim);
      width: 24px; text-align: right; flex-shrink: 0;
    }

    /* ── Hourly heatmap ── */
    .heatmap { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; }
    .heat-cell {
      aspect-ratio: 1; border-radius: 4px;
      background: var(--surface3);
    }
    .heatmap-labels {
      display: grid; grid-template-columns: repeat(24, 1fr);
      margin-top: 4px;
    }
    .heat-label {
      font-family: var(--mono); font-size: 9px; color: var(--text-dim);
      text-align: center;
    }

    /* ── Feedback list ── */
    .feedback-list { display: flex; flex-direction: column; gap: 12px; }
    .feedback-item {
      background: var(--surface2); border: 1px solid var(--border2);
      border-radius: 14px; padding: 16px;
    }
    .feedback-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .feedback-stars-display { font-size: 13px; letter-spacing: 1px; }
    .feedback-meta {
      font-family: var(--mono); font-size: 11px; color: var(--text-dim);
    }
    .feedback-message { font-size: 13px; color: var(--text-mid); line-height: 1.5; }
    .feedback-no-msg { font-size: 12px; color: var(--text-dim); font-style: italic; }

    .empty-state {
      text-align: center; padding: 40px 20px;
      color: var(--text-dim); font-size: 13px;
    }
    .empty-icon { font-size: 28px; margin-bottom: 8px; }

    /* ── Rating breakdown ── */
    .rating-bars { display: flex; flex-direction: column; gap: 8px; }
    .rating-row { display: flex; align-items: center; gap: 10px; }
    .rating-label { font-size: 13px; flex-shrink: 0; }
    .rating-track { flex: 1; height: 8px; background: var(--surface3); border-radius: 99px; overflow: hidden; }
    .rating-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--amber), #F7C948); transition: width 0.6s ease; }
    .rating-count { font-family: var(--mono); font-size: 11px; color: var(--text-dim); width: 20px; text-align: right; flex-shrink: 0; }

    /* ── Avg score display ── */
    .avg-score-wrap { text-align: center; margin-bottom: 20px; }
    .avg-score-num { font-family: var(--mono); font-size: 48px; font-weight: 500; letter-spacing: -3px; color: var(--amber); line-height: 1; }
    .avg-score-stars { font-size: 18px; margin: 4px 0; }
    .avg-score-sub { font-size: 12px; color: var(--text-dim); }

    .loading-screen {
      flex: 1; display: flex; align-items: center; justify-content: center;
      gap: 10px; color: var(--text-dim); font-size: 14px;
    }
    .spinner {
      width: 18px; height: 18px; border: 2px solid var(--border);
      border-top-color: var(--green); border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @media (max-width: 760px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .mid-row { grid-template-columns: 1fr; }
      .main { padding: 16px; gap: 20px; }
      .header { padding: 16px; }
    }
    @media (max-width: 480px) {
      .stats-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCsh-8p7ITozw-E1fbezr9ORMBXK-coDR8",
  authDomain: "bayview-laundry.firebaseapp.com",
  databaseURL: "https://bayview-laundry-default-rtdb.firebaseio.com",
  projectId: "bayview-laundry",
  storageBucket: "bayview-laundry.firebasestorage.app",
  messagingSenderId: "204674191712",
  appId: "1:204674191712:web:f46ffa5b31e4c843198e05"
};

let fbDb, fbGet, fbRef;

async function initFirebase() {
  const { initializeApp, getApps } = await import("https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js");
  const db = await import("https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js");
  const apps = getApps();
  const app = apps.length ? apps[0] : initializeApp(FIREBASE_CONFIG);
  fbDb  = db.getDatabase(app);
  fbGet = db.get;
  fbRef = db.ref;
}

function getTodayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function getLast7Days() {
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const label = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric' });
    days.push({ key, label });
  }
  return days;
}

function fmtDate(ts) {
  return new Date(ts).toLocaleString('en-GB', {
    day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
  });
}

function starStr(n) {
  if (!n) return '—';
  return '★'.repeat(n) + '☆'.repeat(5 - n);
}

function avgRating(feedbacks) {
  const rated = feedbacks.filter(f => f.rating > 0);
  if (!rated.length) return null;
  return (rated.reduce((a, b) => a + b.rating, 0) / rated.length).toFixed(1);
}

// ── Main dashboard ──
function Dashboard() {
  const [data,      setData]      = useState(null);
  const [loading,   setLoading]   = useState(true);
  const [spinning,  setSpinning]  = useState(false);
  const [lastSync,  setLastSync]  = useState(null);

  const load = useCallback(async () => {
    setSpinning(true);
    try {
      const [totalsSnap, dailySnap, hourlySnap, feedbackSnap] = await Promise.all([
        fbGet(fbRef(fbDb, 'analytics/totals')),
        fbGet(fbRef(fbDb, 'analytics/daily')),
        fbGet(fbRef(fbDb, `analytics/hourly/${getTodayKey()}`)),
        fbGet(fbRef(fbDb, 'feedback')),
      ]);

      const totals   = totalsSnap.exists()  ? totalsSnap.val()   : {};
      const daily    = dailySnap.exists()   ? dailySnap.val()    : {};
      const hourly   = hourlySnap.exists()  ? hourlySnap.val()   : {};
      const rawFB    = feedbackSnap.exists() ? feedbackSnap.val() : {};

      // Feedbacks as sorted array (newest first)
      const feedbacks = Object.values(rawFB).sort((a, b) => b.ts - a.ts);

      setData({ totals, daily, hourly, feedbacks });
      setLastSync(Date.now());
    } catch(e) {
      console.error(e);
    } finally {
      setLoading(false);
      setSpinning(false);
    }
  }, []);

  useEffect(() => { load(); }, [load]);

  if (loading) return (
    <div className="loading-screen"><div className="spinner"/><span>Loading dashboard…</span></div>
  );

  const { totals, daily, hourly, feedbacks } = data || {};
  const days7  = getLast7Days();
  const maxDay = Math.max(1, ...days7.map(d => daily?.[d.key]?.uniqueUsers || 0));

  // Hourly heatmap for today
  const maxHour = Math.max(1, ...Array.from({length:24}, (_,i) => hourly?.[`h${i}`] || 0));

  // Rating breakdown
  const ratingCounts = [5,4,3,2,1].map(r => ({
    r,
    count: feedbacks.filter(f => f.rating === r).length
  }));
  const maxRatingCount = Math.max(1, ...ratingCounts.map(x => x.count));
  const avg = avgRating(feedbacks);

  const todayVisits  = daily?.[getTodayKey()]?.uniqueUsers  || 0;
  const todayCycles  = daily?.[getTodayKey()]?.cycles  || 0;
  const totalVisits  = totals?.uniqueUsers  || 0;
  const totalCycles  = totals?.cycles  || 0;

  const syncStr = lastSync
    ? new Date(lastSync).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
    : '—';

  return (
    <>
      <div className="header">
        <div className="header-left">
          <div className="logo-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
              <rect x="2" y="2" width="20" height="20" rx="3"/>
              <circle cx="12" cy="13" r="5"/>
              <circle cx="12" cy="13" r="2"/>
              <line x1="7" y1="6" x2="7.01" y2="6" strokeWidth="2.5"/>
              <line x1="10" y1="6" x2="13" y2="6"/>
            </svg>
          </div>
          <div>
            <div className="header-title">Bayview Laundry</div>
            <div className="header-sub">Admin dashboard</div>
          </div>
          <div className="admin-badge">Admin</div>
        </div>
        <div className="header-right">
          <span className="last-sync">Synced {syncStr}</span>
          <div
            className={`refresh-btn ${spinning ? 'spinning' : ''}`}
            onClick={load}
            title="Refresh"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <polyline points="23 4 23 10 17 10"/>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
          </div>
        </div>
      </div>

      <div className="main">

        {/* ── Stats row ── */}
        <div>
          <div className="section-eyebrow">Overview</div>
          <div className="stats-grid">
            <div className="stat-card">
              <div className="stat-label">Total users</div>
              <div className="stat-value">{totalVisits}</div>
              <div className="stat-badge green">↑ All time</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Today's users</div>
              <div className="stat-value">{todayVisits}</div>
              <div className="stat-badge blue">Today</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Cycles started</div>
              <div className="stat-value">{totalCycles}</div>
              <div className="stat-badge amber">All time</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Feedback items</div>
              <div className="stat-value">{feedbacks.length}</div>
              <div className="stat-badge purple">Received</div>
            </div>
          </div>
        </div>

        {/* ── Mid row: 7-day + today's heatmap ── */}
        <div className="mid-row">
          <div className="panel">
            <div className="panel-title">Users — last 7 days</div>
            <div className="bar-chart">
              {days7.map(({ key, label }) => {
                const v = daily?.[key]?.uniqueUsers || 0;
                const pct = (v / maxDay) * 100;
                return (
                  <div className="bar-row" key={key}>
                    <div className="bar-day">{label.split(' ')[0]}</div>
                    <div className="bar-track">
                      <div className="bar-fill" style={{width: `${pct}%`}}/>
                    </div>
                    <div className="bar-val">{v}</div>
                  </div>
                );
              })}
            </div>
          </div>

          <div className="panel">
            <div className="panel-title">Active hours — today</div>
            <div className="heatmap">
              {Array.from({length:24}, (_,i) => {
                const v = hourly?.[`h${i}`] || 0;
                const pct = v / maxHour;
                const alpha = 0.08 + pct * 0.92;
                return (
                  <div
                    key={i}
                    className="heat-cell"
                    title={`${i}:00 — ${v} visit${v!==1?'s':''}`}
                    style={{ background: v > 0 ? `rgba(0,196,140,${alpha.toFixed(2)})` : undefined }}
                  />
                );
              })}
            </div>
            <div className="heatmap-labels">
              {Array.from({length:24}, (_,i) => (
                <div className="heat-label" key={i}>
                  {i % 6 === 0 ? `${i}h` : ''}
                </div>
              ))}
            </div>
            <div style={{marginTop: 20}}>
              <div style={{display:'flex', justifyContent:'space-between', marginBottom: 8}}>
                <span style={{fontSize:12, color:'var(--text-mid)', fontWeight:600}}>Today's cycles</span>
                <span style={{fontFamily:'var(--mono)', fontSize:12, color:'var(--text-dim)'}}>{todayCycles} started</span>
              </div>
              {['washer','dryer'].map(t => {
                const c = daily?.[getTodayKey()]?.[`cycles_${t}`] || 0;
                return (
                  <div className="bar-row" key={t} style={{marginBottom:6}}>
                    <div className="bar-day" style={{width:42}}>{t === 'washer' ? 'Wash' : 'Dry'}</div>
                    <div className="bar-track">
                      <div className="bar-fill" style={{width:`${todayCycles > 0 ? (c/todayCycles)*100 : 0}%`, background:'linear-gradient(90deg,#4F8EF7,#74AAFF)'}}/>
                    </div>
                    <div className="bar-val">{c}</div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>

        {/* ── Feedback row ── */}
        <div className="mid-row">

          {/* Rating summary */}
          <div className="panel">
            <div className="panel-title">Ratings</div>
            {feedbacks.length === 0 ? (
              <div className="empty-state">
                <div className="empty-icon">⭐</div>
                No ratings yet
              </div>
            ) : (
              <>
                <div className="avg-score-wrap">
                  <div className="avg-score-num">{avg || '—'}</div>
                  <div className="avg-score-stars">{avg ? '★'.repeat(Math.round(avg)) + '☆'.repeat(5-Math.round(avg)) : ''}</div>
                  <div className="avg-score-sub">{feedbacks.filter(f=>f.rating>0).length} ratings</div>
                </div>
                <div className="rating-bars">
                  {ratingCounts.map(({r, count}) => (
                    <div className="rating-row" key={r}>
                      <div className="rating-label">{'★'.repeat(r)}</div>
                      <div className="rating-track">
                        <div className="rating-fill" style={{width:`${(count/maxRatingCount)*100}%`}}/>
                      </div>
                      <div className="rating-count">{count}</div>
                    </div>
                  ))}
                </div>
              </>
            )}
          </div>

          {/* Feedback messages */}
          <div className="panel" style={{maxHeight: 480, overflowY: 'auto'}}>
            <div className="panel-title">Feedback messages</div>
            {feedbacks.length === 0 ? (
              <div className="empty-state">
                <div className="empty-icon">💬</div>
                No feedback yet
              </div>
            ) : (
              <div className="feedback-list">
                {feedbacks.map((f, i) => (
                  <div className="feedback-item" key={i}>
                    <div className="feedback-header">
                      <span className="feedback-stars-display">{starStr(f.rating)}</span>
                      <span className="feedback-meta">{fmtDate(f.ts)}</span>
                    </div>
                    {f.message
                      ? <div className="feedback-message">{f.message}</div>
                      : <div className="feedback-no-msg">No message</div>
                    }
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>

      </div>
    </>
  );
}

// ── Root ──
function App() {
  const [fbReady, setFbReady] = useState(false);

  useEffect(() => {
    initFirebase().then(() => setFbReady(true)).catch(console.error);
  }, []);

  if (!fbReady) return <div className="loading-screen"><div className="spinner"/><span>Initialising…</span></div>;
  return <Dashboard />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
