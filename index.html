<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bayview Laundry — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #F0F2F7;
      --surface:      #FFFFFF;
      --surface2:     #F7F8FC;
      --surface3:     #EEF0F6;
      --border:       rgba(0,0,0,0.07);
      --border2:      rgba(0,0,0,0.04);
      --shadow:       0 2px 12px rgba(0,0,0,0.07), 0 1px 3px rgba(0,0,0,0.05);
      --shadow-lg:    0 8px 32px rgba(0,0,0,0.10), 0 2px 8px rgba(0,0,0,0.06);
      --green:        #00A878;
      --green-dim:    rgba(0,168,120,0.08);
      --green-border: rgba(0,168,120,0.22);
      --blue:         #2C6EE8;
      --blue-dim:     rgba(44,110,232,0.08);
      --amber:        #D97706;
      --amber-dim:    rgba(217,119,6,0.08);
      --red:          #E8354A;
      --red-dim:      rgba(232,53,74,0.07);
      --purple:       #7C3AED;
      --purple-dim:   rgba(124,58,237,0.08);
      --text:         #141820;
      --text-mid:     #4A5468;
      --text-dim:     #9AA3B5;
      --mono:         'IBM Plex Mono', monospace;
      --sans:         'Space Grotesk', sans-serif;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); }
    #root { min-height: 100vh; display: flex; flex-direction: column; }

    /* ── Header ── */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 32px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .logo-mark {
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      position: relative;
    }
    .logo-mark canvas {
      position: relative; z-index: 1;
      filter: drop-shadow(0 6px 8px rgba(20,24,32,0.28)) drop-shadow(0 2px 3px rgba(20,24,32,0.18));
    }
    .header-title { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; color: var(--text); }
    .header-sub { font-size: 11px; color: var(--text-mid); margin-top: 1px; }
    .admin-badge {
      padding: 4px 10px; border-radius: 20px;
      background: var(--green-dim); border: 1px solid var(--green-border);
      font-size: 11px; font-weight: 600; color: var(--green);
      font-family: var(--mono); letter-spacing: 0.06em; text-transform: uppercase;
    }
    .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .live-badge {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--green); font-family: var(--mono);
    }
    .live-dot {
      width: 7px; height: 7px; border-radius: 50%; background: var(--green);
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%,100% { box-shadow: 0 0 0 0 rgba(0,168,120,0.5); }
      50%      { box-shadow: 0 0 0 5px rgba(0,168,120,0); }
    }
    .last-sync {
      font-family: var(--mono); font-size: 10px; color: var(--text-dim);
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Layout ── */
    .main {
      flex: 1; padding: 32px;
      max-width: 1080px; width: 100%; margin: 0 auto;
      display: flex; flex-direction: column; gap: 32px;
    }

    .section-eyebrow {
      font-size: 11px; font-weight: 600; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--text-dim); margin-bottom: 14px;
    }

    /* ── Stat cards row ── */
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }

    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 22px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .stat-label {
      font-size: 11px; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--text-mid);
    }
    .stat-value {
      font-family: var(--mono); font-size: 36px; font-weight: 500;
      letter-spacing: -2px; line-height: 1; color: var(--text);
    }
    .stat-sub { font-size: 12px; color: var(--text-dim); }
    .stat-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 600; font-family: var(--mono);
      padding: 3px 8px; border-radius: 6px; width: fit-content;
    }
    .stat-badge.green { background: var(--green-dim); color: var(--green); }
    .stat-badge.blue  { background: var(--blue-dim);  color: var(--blue); }
    .stat-badge.amber { background: var(--amber-dim); color: var(--amber); }
    .stat-badge.purple{ background: var(--blue-dim);  color: var(--blue);  }

    /* ── Two-column middle row ── */
    .mid-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    /* ── Panel ── */
    .panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 24px;
    }
    .panel-title {
      font-size: 14px; font-weight: 700; color: var(--text);
      margin-bottom: 20px; letter-spacing: -0.2px;
    }
    .panel-title-row {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 20px;
    }
    .panel-title-row .panel-title { margin-bottom: 0; }
    .panel-note {
      font-family: var(--mono); font-size: 10px; color: var(--text-dim);
    }

    /* ── Users panel ── */
    .users-panel .panel-title-row { margin-bottom: 20px; }
    .user-tiles {
      display: grid; grid-template-columns: repeat(3, 1fr);
      margin-bottom: 24px;
    }
    .user-tile { padding-left: 16px; margin-left: 8px; border-left: 0.5px solid var(--border); }
    .user-tile:first-child {
      padding-left: 12px; margin-left: 0;
      border-left: 2px solid var(--green);
    }
    .user-tile-label {
      font-size: 10px; font-weight: 600; color: var(--text-mid);
      letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px;
    }
    .user-tile-value {
      font-family: var(--mono); font-size: 30px; font-weight: 500;
      letter-spacing: -1.5px; line-height: 1; color: var(--text);
    }
    .user-tile-sub { font-size: 9px; color: var(--text-dim); margin-top: 6px; }
    .user-tile-sub.up { color: var(--green); font-weight: 600; }

    .users-panel .bar-chart { gap: 9px; margin-bottom: 14px; }
    .users-panel .bar-row { gap: 12px; }
    .users-panel .bar-day {
      width: 30px; text-align: left; font-size: 10px;
      letter-spacing: 0.04em; color: var(--text-dim);
    }
    .users-panel .bar-track { height: 7px; background: var(--surface3); }
    .users-panel .bar-val { width: 18px; color: var(--text-mid); }
    .stack-track { display: flex; }
    .stack-ret {
      height: 100%; background: #C2C8D6;
      transition: width 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .stack-new {
      height: 100%; background: linear-gradient(90deg, #00A878, #00C48C);
      transition: width 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .stack-legend { display: flex; gap: 16px; margin-bottom: 20px; }
    .stack-legend .legend-item { font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; }
    .stack-legend .legend-dot { border-radius: 2px; }

    .users-footer {
      border-top: 0.5px solid var(--border); padding-top: 18px;
      display: flex; align-items: center; gap: 20px;
    }
    .users-footer-hero {
      font-family: var(--mono); font-size: 22px; font-weight: 500;
      letter-spacing: -1.5px; line-height: 1; color: #0F6E56;
    }
    .users-footer-hero span { font-size: 20px; }
    .users-footer-alt {
      font-family: var(--mono); font-size: 22px; font-weight: 500;
      letter-spacing: -1px; line-height: 1; color: var(--text);
    }
    .users-footer-label { font-size: 11px; color: var(--text-mid); margin-top: 5px; }
    .users-footer-divider { width: 0.5px; align-self: stretch; background: var(--border); }

    @keyframes user-rise {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .users-panel .user-tile,
    .users-panel .bar-row { animation: user-rise 0.5s cubic-bezier(0.34, 1.4, 0.64, 1) backwards; }
    .users-panel .user-tile:nth-child(1) { animation-delay: 0.02s; }
    .users-panel .user-tile:nth-child(2) { animation-delay: 0.08s; }
    .users-panel .user-tile:nth-child(3) { animation-delay: 0.14s; }
    .users-panel .bar-row:nth-child(1) { animation-delay: 0.16s; }
    .users-panel .bar-row:nth-child(2) { animation-delay: 0.20s; }
    .users-panel .bar-row:nth-child(3) { animation-delay: 0.24s; }
    .users-panel .bar-row:nth-child(4) { animation-delay: 0.28s; }
    .users-panel .bar-row:nth-child(5) { animation-delay: 0.32s; }
    .users-panel .bar-row:nth-child(6) { animation-delay: 0.36s; }
    .users-panel .bar-row:nth-child(7) { animation-delay: 0.40s; }
    @media (prefers-reduced-motion: reduce) {
      .users-panel .user-tile,
      .users-panel .bar-row { animation: none; }
    }

    /* ── Weekly history panel (column chart) ── */
    .wk-chart {
      display: flex; align-items: flex-end; gap: 8px;
      height: 150px; margin-bottom: 8px;
    }
    .wk-col {
      flex: 1; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-end;
      animation: user-rise 0.5s cubic-bezier(0.34, 1.4, 0.64, 1) backwards;
    }
    .wk-col:nth-child(1) { animation-delay: 0.04s; }
    .wk-col:nth-child(2) { animation-delay: 0.08s; }
    .wk-col:nth-child(3) { animation-delay: 0.12s; }
    .wk-col:nth-child(4) { animation-delay: 0.16s; }
    .wk-col:nth-child(5) { animation-delay: 0.20s; }
    .wk-col:nth-child(6) { animation-delay: 0.24s; }
    .wk-col:nth-child(7) { animation-delay: 0.28s; }
    .wk-col:nth-child(8) { animation-delay: 0.32s; }
    .wk-total {
      font-family: var(--mono); font-size: 11px; color: var(--text-mid);
      margin-bottom: 5px;
    }
    .wk-stack {
      width: 100%; max-width: 26px;
      display: flex; flex-direction: column;
      border-radius: 6px; overflow: hidden;
    }
    .wk-new {
      width: 100%;
      background: linear-gradient(180deg, #00C48C, #00A878);
      transition: height 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .wk-ret {
      width: 100%; background: #C2C8D6;
      transition: height 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .wk-col.now .wk-total { color: var(--green); font-weight: 500; }
    .wk-col.now .wk-new,
    .wk-col.now .wk-ret { opacity: 0.45; }
    .wk-axis {
      display: flex; gap: 8px;
      border-top: 0.5px solid var(--border);
      padding-top: 6px; margin-bottom: 14px;
    }
    .wk-axis span {
      flex: 1; text-align: center;
      font-family: var(--mono); font-size: 10px; color: var(--text-dim);
      letter-spacing: 0.04em;
    }
    @media (prefers-reduced-motion: reduce) {
      .wk-col { animation: none; }
    }

    /* ── Bar chart ── */
    .bar-chart { display: flex; flex-direction: column; gap: 10px; }
    .bar-row { display: flex; align-items: center; gap: 12px; }
    .bar-day {
      font-family: var(--mono); font-size: 11px; color: var(--text-mid);
      width: 36px; flex-shrink: 0; text-align: left;
    }
    .bar-track {
      flex: 1; height: 8px; background: var(--surface3);
      border-radius: 99px; overflow: hidden;
    }
    .bar-fill {
      height: 100%; border-radius: 99px;
      background: linear-gradient(90deg, #00A878, #00C48C);
      transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .bar-val {
      font-family: var(--mono); font-size: 11px; color: var(--text-dim);
      width: 24px; text-align: right; flex-shrink: 0;
    }

    /* ── Hourly heatmap ── */
    .heatmap { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; }
    .heat-cell {
      aspect-ratio: 1; border-radius: 4px;
      background: var(--surface3);
    }
    .heatmap-labels {
      display: grid; grid-template-columns: repeat(24, 1fr);
      margin-top: 4px;
    }
    .heat-label {
      font-family: var(--mono); font-size: 9px; color: var(--text-dim);
      text-align: center;
    }

    /* ── Feedback list ── */
    .feedback-list { display: flex; flex-direction: column; gap: 12px; }
    .feedback-item {
      background: var(--surface2); border: 1px solid var(--border2);
      border-radius: 14px; padding: 16px;
    }
    .feedback-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .feedback-stars-display { font-size: 13px; letter-spacing: 1px; }
    .feedback-meta {
      font-family: var(--mono); font-size: 11px; color: var(--text-dim);
    }
    .feedback-message { font-size: 13px; color: var(--text-mid); line-height: 1.5; }
    .feedback-no-msg { font-size: 12px; color: var(--text-dim); font-style: italic; }

    .empty-state {
      text-align: center; padding: 40px 20px;
      color: var(--text-dim); font-size: 13px;
    }
    .empty-icon { font-size: 28px; margin-bottom: 8px; }

    /* ── Rating breakdown ── */
    .rating-bars { display: flex; flex-direction: column; gap: 8px; }
    .rating-row { display: flex; align-items: center; gap: 10px; }
    .rating-label { font-size: 13px; flex-shrink: 0; }
    .rating-track { flex: 1; height: 8px; background: var(--surface3); border-radius: 99px; overflow: hidden; }
    .rating-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--amber), #F7C948); transition: width 0.6s ease; }
    .rating-count { font-family: var(--mono); font-size: 11px; color: var(--text-dim); width: 20px; text-align: right; flex-shrink: 0; }

    /* ── Avg score display ── */
    .avg-score-wrap { text-align: center; margin-bottom: 20px; }
    .avg-score-num { font-family: var(--mono); font-size: 48px; font-weight: 500; letter-spacing: -3px; color: var(--amber); line-height: 1; }
    .avg-score-stars { font-size: 18px; margin: 4px 0; }
    .avg-score-sub { font-size: 12px; color: var(--text-dim); }

    .loading-screen {
      flex: 1; display: flex; align-items: center; justify-content: center;
      gap: 10px; color: var(--text-dim); font-size: 14px;
    }
    .spinner {
      width: 18px; height: 18px; border: 2px solid var(--border);
      border-top-color: var(--green); border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    /* ── 3D Scene panel ── */
    .scene-panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; overflow: hidden; position: relative;
      width: 100%; height: 560px;
    }
    .scene-canvas {
      width: 100%; height: 100%; display: block;
    }
    .scene-legend {
      position: absolute; bottom: 16px; left: 20px;
      display: flex; gap: 16px; align-items: center;
    }
    .legend-item {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 600; color: var(--text-mid);
      font-family: var(--mono); letter-spacing: 0.04em;
    }
    .legend-dot {
      width: 10px; height: 10px; border-radius: 50%;
    }
    .scene-title {
      position: absolute; top: 16px; left: 20px;
      font-size: 14px; font-weight: 700; color: var(--text);
      letter-spacing: -0.2px;
    }
    .scene-subtitle {
      position: absolute; top: 38px; left: 20px;
      font-size: 11px; color: var(--text-dim); font-family: var(--mono);
    }

    /* ── Scan status label (shown while the poster scan plays) ── */
    .scan-label {
      position: absolute; left: 50%; top: 16px; transform: translateX(-50%);
      z-index: 6; pointer-events: none;
      display: flex; align-items: center; gap: 6px;
      padding: 5px 11px; border-radius: 16px;
      background: rgba(0,196,140,0.12);
      border: 1px solid rgba(0,196,140,0.4);
      backdrop-filter: blur(8px) saturate(160%);
      -webkit-backdrop-filter: blur(8px) saturate(160%);
      font-family: var(--mono); font-size: 9px; font-weight: 600;
      color: #00C48C; letter-spacing: 0.02em;
      box-shadow: 0 4px 16px rgba(0,196,140,0.18);
      animation: scan-label-in 0.25s ease;
    }
    @keyframes scan-label-in {
      from { opacity: 0; transform: translateX(-50%) translateY(-6px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    .scan-label-dot {
      width: 5px; height: 5px; border-radius: 50%; background: #00C48C;
      animation: scan-label-pulse 1s ease-in-out infinite;
    }
    @keyframes scan-label-pulse {
      0%,100% { opacity: 1; box-shadow: 0 0 0 0 rgba(0,196,140,0.5); }
      50%     { opacity: 0.5; box-shadow: 0 0 0 5px rgba(0,196,140,0); }
    }
    .scan-dots::after {
      content: ''; animation: scan-dots 1.1s steps(4, end) infinite;
    }
    @keyframes scan-dots {
      0%   { content: ''; }
      25%  { content: '.'; }
      50%  { content: '..'; }
      75%  { content: '...'; }
      100% { content: ''; }
    }

    /* ── Mini floating machine cards (glassmorphic) ── */
    .mini-card {
      position: absolute; transform: translate(-50%, -100%);
      pointer-events: none; z-index: 5;
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(10px) saturate(160%);
      -webkit-backdrop-filter: blur(10px) saturate(160%);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 10px;
      padding: 6px 9px;
      box-shadow: 0 4px 14px rgba(20,24,32,0.10), 0 1px 3px rgba(20,24,32,0.06);
      min-width: 76px;
      transition: left 0.05s linear, top 0.05s linear;
    }
    .mini-card-row {
      display: flex; align-items: center; gap: 5px;
      white-space: nowrap;
    }
    .mini-card-dot {
      width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
    }
    .mini-card-label {
      font-family: var(--mono); font-size: 9px; font-weight: 600;
      color: var(--text); letter-spacing: 0.02em;
    }
    .mini-card-status {
      font-family: var(--sans); font-size: 9px; font-weight: 600;
      margin-left: auto; padding-left: 6px;
    }
    .mini-card.mini-available .mini-card-dot { background: var(--green); }
    .mini-card.mini-available .mini-card-status { color: var(--green); }
    .mini-card.mini-inuse .mini-card-dot { background: var(--red); animation: blink 1.2s ease-in-out infinite; }
    .mini-card.mini-inuse .mini-card-status { color: var(--red); }
    .mini-card.mini-ooo .mini-card-dot { background: var(--amber); }
    .mini-card.mini-ooo .mini-card-status { color: var(--amber); }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.25;} }

    /* ── Ring timer card (glassmorphic, sits to the right of the mini card) ── */
    .ring-card {
      position: absolute; transform: translate(-50%, -100%);
      pointer-events: none; z-index: 5;
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(10px) saturate(160%);
      -webkit-backdrop-filter: blur(10px) saturate(160%);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 10px;
      padding: 6px 9px;
      box-shadow: 0 4px 14px rgba(20,24,32,0.10), 0 1px 3px rgba(20,24,32,0.06);
      display: flex; align-items: center; gap: 6px;
      white-space: nowrap;
      transition: left 0.05s linear, top 0.05s linear;
    }
    .ring-card-ring {
      position: relative; width: 29px; height: 29px; flex-shrink: 0;
    }
    .ring-card-ring svg { transform: rotate(-90deg); display: block; }
    .ring-card-bg { fill: none; stroke: rgba(232,53,74,0.12); stroke-width: 3.5; }
    .ring-card-progress { fill: none; stroke: var(--red); stroke-width: 3.5; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
    .ring-card-pct {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-family: var(--mono); font-size: 7px; font-weight: 600; color: var(--red);
    }
    .ring-card-info { display: flex; flex-direction: column; gap: 1px; }
    .ring-card-label { font-size: 8px; color: var(--text-dim); }
    .ring-card-value { font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--text); letter-spacing: -0.2px; }

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

let fbDb, fbGet, fbRef, fbOnValue;

async function initFirebase() {
  await window.__bvFirebaseReady;
  fbDb      = window.__bvFbDb;
  fbGet     = window.__bvFbGet;
  fbRef     = window.__bvFbRef;
  fbOnValue = window.__bvFbOnValue;
}

function getTodayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function getLast7Days() {
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const label = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric' });
    days.push({ key, label });
  }
  return days;
}

function fmtDate(ts) {
  return new Date(ts).toLocaleString('en-GB', {
    day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
  });
}

function starStr(n) {
  if (!n) return '—';
  return '★'.repeat(n) + '☆'.repeat(5 - n);
}

function avgRating(feedbacks) {
  const rated = feedbacks.filter(f => f.rating > 0);
  if (!rated.length) return null;
  return (rated.reduce((a, b) => a + b.rating, 0) / rated.length).toFixed(1);
}

// ── Weekly bucketing helpers ──
// Parse a "YYYY-MM-DD" key into a local Date (avoids UTC offset surprises).
function parseDateKey(key) {
  const [y, m, d] = key.split('-').map(Number);
  return new Date(y, m - 1, d);
}

// Monday-start week key for a given Date, returned as the week's Monday "YYYY-MM-DD".
function mondayKeyOf(date) {
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const day = (d.getDay() + 6) % 7; // 0 = Monday … 6 = Sunday
  d.setDate(d.getDate() - day);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// Build the last N Monday-start weeks (oldest → newest), each with a short label.
function getLastNWeeks(n) {
  const weeks = [];
  const thisMonday = parseDateKey(mondayKeyOf(new Date()));
  for (let i = n - 1; i >= 0; i--) {
    const wStart = new Date(thisMonday);
    wStart.setDate(wStart.getDate() - i * 7);
    const key = `${wStart.getFullYear()}-${String(wStart.getMonth()+1).padStart(2,'0')}-${String(wStart.getDate()).padStart(2,'0')}`;
    // Friendly, unambiguous label: the week's Monday as "d MMM" (e.g. "29 Jun").
    // Each column represents the Mon–Sun week beginning on that date.
    const label = wStart.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    weeks.push({ key, start: wStart, label });
  }
  return weeks;
}

// ── 3D Laundry Room Scene ──
function LaundryScene({ machineState }) {
  const mountRef = React.useRef(null);
  const sceneRef = React.useRef({});
  const [cardPositions, setCardPositions] = useState({});
  const [scanningLabel, setScanningLabel] = useState(false);

  // Machine layout: [id, col, row]  — two washers top, two dryers bottom
  const LAYOUT = [
    { id: 'wm1', label: 'WM1', col: 0, row: 0 },
    { id: 'wm2', label: 'WM2', col: 1, row: 0 },
    { id: 'td1', label: 'TD1', col: 0, row: 1 },
    { id: 'td2', label: 'TD2', col: 1, row: 1 },
  ];

  const STATUS_COLORS = {
    available:    0x00A878,
    'in-use':     0xE8354A,
    'out-of-order': 0xD97706,
  };
  const GLOW_COLORS = {
    available:    0x00C48C,
    'in-use':     0xFF4560,
    'out-of-order': 0xF5A623,
  };

  function getStatus(id) {
    if (!machineState || !machineState[id]) return 'available';
    const d = machineState[id];
    if (d.status === 'out-of-order') return 'out-of-order';
    if (d.status === 'in-use' && d.endsAt && d.endsAt > Date.now()) return 'in-use';
    return 'available';
  }

  useEffect(() => {
    const el = mountRef.current;
    if (!el) return;
    const THREE = window.THREE;

    // Guard against a zero-size mount (can happen on first mobile layout pass)
    const getSize = () => {
      const w = el.clientWidth  || el.parentElement?.clientWidth  || 320;
      const h = el.clientHeight || el.parentElement?.clientHeight || 360;
      return { w, h };
    };
    const { w: W, h: H } = getSize();

    // ── Renderer ──
    const renderer = new THREE.WebGLRenderer({ canvas: el, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(W, H, false);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setClearColor(0xFFFFFF, 0);

    // ── Scene ──
    const scene = new THREE.Scene();

    // ── Isometric camera ──
    const aspect = W / H;
    const d = 6.2;
    const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 0.1, 100);
    // Orbit the camera around the room by 45° so we look down the aisle
    // instead of from the corner, while keeping the same isometric angle/distance
    const camRadius = Math.sqrt(8*8 + 8*8);
    const camAngle  = Math.PI / 4; // rotate 45°
    camera.position.set(camRadius * Math.sin(camAngle), 10, camRadius * Math.cos(camAngle));
    camera.lookAt(0, 0, 0);

    // ── Lights ──
    const ambient = new THREE.AmbientLight(0xffffff, 0.55);
    scene.add(ambient);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(6, 12, 8);
    dirLight.castShadow = true;
    dirLight.shadow.camera.near = 0.1;
    dirLight.shadow.camera.far = 60;
    dirLight.shadow.camera.left = -10;
    dirLight.shadow.camera.right = 10;
    dirLight.shadow.camera.top = 10;
    dirLight.shadow.camera.bottom = -10;
    dirLight.shadow.mapSize.set(1024, 1024);
    scene.add(dirLight);

    const fillLight = new THREE.DirectionalLight(0xdde8ff, 0.3);
    fillLight.position.set(-5, 5, -5);
    scene.add(fillLight);

    // ── Floor ──
    const floorGeo = new THREE.PlaneGeometry(7, 6.6);
    const floorMat = new THREE.MeshLambertMaterial({ color: 0xF0F2F7 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(0.5, 0, 0.2);
    floor.receiveShadow = true;
    scene.add(floor);

    // Floor tile grid lines
    const tileSize = 0.9;
    const lineMat = new THREE.LineBasicMaterial({ color: 0xDDE0EB, transparent: true, opacity: 0.6 });
    for (let x = -3; x <= 4; x++) {
      const geo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(x * tileSize, 0.002, -3.2),
        new THREE.Vector3(x * tileSize, 0.002,  3.6),
      ]);
      scene.add(new THREE.Line(geo, lineMat));
    }
    for (let z = -4; z <= 4; z++) {
      const geo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(-3.0, 0.002, z * tileSize),
        new THREE.Vector3( 4.0, 0.002, z * tileSize),
      ]);
      scene.add(new THREE.Line(geo, lineMat));
    }

    // ── Back walls ──
    const wallMat = new THREE.MeshLambertMaterial({ color: 0xE8EAF0 });
    // back wall
    const backWall = new THREE.Mesh(new THREE.BoxGeometry(7, 2.2, 0.12), wallMat);
    backWall.position.set(0.5, 1.1, -3.25);
    backWall.receiveShadow = true;
    scene.add(backWall);
    // left wall
    const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.12, 2.2, 6.8), wallMat);
    leftWall.position.set(-3.0, 1.1, 0.2);
    leftWall.receiveShadow = true;
    scene.add(leftWall);

    // ── Wall poster (real textured plane, mounted flush on the left wall) ──
    function makePosterTexture() {
      const c = document.createElement('canvas');
      const S = 512;
      c.width = S; c.height = Math.round(S * 1.3);
      const ctx = c.getContext('2d');
      const W = c.width, H = c.height;

      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = '#E3E6EF';
      ctx.lineWidth = 6;
      ctx.strokeRect(3, 3, W - 6, H - 6);

      const tileX = W/2 - 46, tileY = 40, tileS = 92;
      const grad = ctx.createLinearGradient(tileX, tileY, tileX + tileS, tileY + tileS);
      grad.addColorStop(0, '#00A878'); grad.addColorStop(1, '#00C2A0');
      ctx.fillStyle = grad;
      roundRect(ctx, tileX, tileY, tileS, tileS, 22); ctx.fill();
      ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 7; ctx.lineCap = 'round';
      roundRect(ctx, tileX+24, tileY+20, tileS-48, tileS-40, 8); ctx.stroke();
      ctx.beginPath(); ctx.arc(W/2, tileY+tileS/2+4, 17, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(W/2, tileY+tileS/2+4, 6, 0, Math.PI*2); ctx.stroke();

      ctx.fillStyle = '#141820';
      ctx.textAlign = 'center';
      ctx.font = '700 42px "Space Grotesk", sans-serif';
      ctx.fillText('Bayview Laundry', W/2, 210);

      ctx.fillStyle = '#9AA3B5';
      ctx.font = '400 22px "Space Grotesk", sans-serif';
      ctx.fillText('Scan the QR code to check', W/2, 246);
      ctx.fillText('live machine availability.', W/2, 274);

      const qrSize = 300, qrX = W/2 - qrSize/2, qrY = 300;
      ctx.fillStyle = '#FFFFFF';
      roundRect(ctx, qrX-14, qrY-14, qrSize+28, qrSize+28, 16); ctx.fill();
      ctx.strokeStyle = '#E3E6EF'; ctx.lineWidth = 3; ctx.stroke();
      if (window.qrcode) {
        try {
          const qr = window.qrcode(0, 'M');
          qr.addData(LAUNDRY_URL);
          qr.make();
          const n = qr.getModuleCount();
          const cell = qrSize / n;
          ctx.fillStyle = '#141820';
          for (let row = 0; row < n; row++) {
            for (let col = 0; col < n; col++) {
              if (qr.isDark(row, col)) {
                ctx.fillRect(qrX + col*cell, qrY + row*cell, cell+0.5, cell+0.5);
              }
            }
          }
        } catch(e) { console.warn('QR draw failed', e); }
      }

      ctx.fillStyle = '#00A878';
      ctx.font = '500 24px "IBM Plex Mono", monospace';
      ctx.fillText('bayviewlaundry.netlify.app', W/2, qrY + qrSize + 60);

      ctx.fillStyle = '#9AA3B5';
      ctx.font = '400 18px "Space Grotesk", sans-serif';
      ctx.fillText('No app required · scan with your camera', W/2, qrY + qrSize + 96);

      const tex = new THREE.CanvasTexture(c);
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      tex.needsUpdate = true;
      return { tex, canvas: c };
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x+r, y);
      ctx.arcTo(x+w, y,   x+w, y+h, r);
      ctx.arcTo(x+w, y+h, x,   y+h, r);
      ctx.arcTo(x,   y+h, x,   y,   r);
      ctx.arcTo(x,   y,   x+w, y,   r);
      ctx.closePath();
    }

    const posterData = makePosterTexture();
    const posterMat = new THREE.MeshBasicMaterial({ map: posterData.tex, transparent: true });

    if (!window.qrcode) {
      let qrTries = 0;
      const qrPoll = setInterval(() => {
        if (window.qrcode) {
          const fresh = makePosterTexture();
          posterMat.map = fresh.tex;
          posterMat.needsUpdate = true;
          clearInterval(qrPoll);
        } else if (qrTries++ > 25) {
          clearInterval(qrPoll);
        }
      }, 150);
    }
    const posterW = 0.76, posterH = 0.76 * 1.3;
    const posterMesh = new THREE.Mesh(new THREE.PlaneGeometry(posterW, posterH), posterMat);
    posterMesh.position.set(-2.93, 1.3, 0.1);
    posterMesh.rotation.y = Math.PI / 2;
    posterMesh.name = 'wallPoster';
    scene.add(posterMesh);

    const frameMat = new THREE.MeshBasicMaterial({ color: 0xD8DBE6 });
    const frameMesh = new THREE.Mesh(new THREE.PlaneGeometry(posterW + 0.04, posterH + 0.04), frameMat);
    frameMesh.position.set(-2.935, 1.3, 0.1);
    frameMesh.rotation.y = Math.PI / 2;
    scene.add(frameMesh);

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => {
        const fresh = makePosterTexture();
        posterMat.map = fresh.tex;
        posterMat.needsUpdate = true;
      }).catch(() => {});
    }

    const scanMat = new THREE.MeshBasicMaterial({ color: 0x00C48C, transparent: true, opacity: 0.55 });
    const scanMesh = new THREE.Mesh(new THREE.PlaneGeometry(posterW * 0.6, 0.045), scanMat);
    scanMesh.position.set(-2.925, 1.3, 0.1);
    scanMesh.rotation.y = Math.PI / 2;
    scanMesh.visible = false;
    scene.add(scanMesh);

    // ── Skirting boards ──
    const skirtMat = new THREE.MeshLambertMaterial({ color: 0xD0D4E0 });
    const skirtBack = new THREE.Mesh(new THREE.BoxGeometry(7, 0.12, 0.12), skirtMat);
    skirtBack.position.set(0.5, 0.06, -3.19);
    scene.add(skirtBack);
    const skirtLeft = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 6.8), skirtMat);
    skirtLeft.position.set(-2.94, 0.06, 0.2);
    scene.add(skirtLeft);

    // ── Laundry basket (decorative) ──
    const basketMat = new THREE.MeshLambertMaterial({ color: 0xC8CEDC });
    const basket = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.22, 0.52, 12), basketMat);
    basket.position.set(3.6, 0.26, 2.7);
    basket.castShadow = true;
    scene.add(basket);
    const rimMat = new THREE.MeshLambertMaterial({ color: 0xB0B8CC });
    const rim = new THREE.Mesh(new THREE.TorusGeometry(0.28, 0.025, 6, 18), rimMat);
    rim.rotation.x = Math.PI / 2;
    rim.position.set(2.75, 0.52, 2.7);
    scene.add(rim);

    // ── Detergent bottles ──
    const detMat = new THREE.MeshLambertMaterial({ color: 0x00A878 });
    const det1 = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.35, 8), detMat);
    det1.position.set(-2.5, 0.175, -2.8);
    det1.castShadow = true;
    scene.add(det1);
    const detLidMat = new THREE.MeshLambertMaterial({ color: 0x007A58 });
    const detLid = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.09, 0.06, 8), detLidMat);
    detLid.position.set(-2.5, 0.38, -2.8);
    scene.add(detLid);
    const det2 = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.28, 8),
      new THREE.MeshLambertMaterial({ color: 0x4F8EF7 }));
    det2.position.set(-2.28, 0.14, -2.8);
    det2.castShadow = true;
    scene.add(det2);

    // ── Build machines ──
    const machines = {};

    LAYOUT.forEach(({ id, col, row }) => {
      const status = getStatus(id);
      const color  = STATUS_COLORS[status];
      const group  = new THREE.Group();

      const x = col === 0 ? -1.1 : 2.5;
      const z = row === 0 ? -1.8 :  2.7;
      group.position.set(x, 0, z);
      if (row === 1) group.rotation.y = Math.PI;

      const bodyMat = new THREE.MeshLambertMaterial({ color: 0xF7F8FC });
      const body = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.0, 1.2), bodyMat);
      body.position.y = 0.5;
      body.castShadow = true;
      body.receiveShadow = true;
      group.add(body);

      const topMat = new THREE.MeshLambertMaterial({ color: 0xECEEF5 });
      const top = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.06, 1.2), topMat);
      top.position.y = 1.03;
      group.add(top);

      const stripMat = new THREE.MeshLambertMaterial({ color });
      const strip = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.07, 0.02), stripMat);
      strip.position.set(0, 0.97, 0.61);
      group.add(strip);

      const doorRingMat = new THREE.MeshLambertMaterial({ color: 0xD0D4DF });
      const doorRing = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.04, 24), doorRingMat);
      doorRing.rotation.x = Math.PI / 2;
      doorRing.position.set(0, 0.48, 0.62);
      group.add(doorRing);

      const drumMat = new THREE.MeshLambertMaterial({ color: 0xB8BDD0 });
      const drum = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.05, 20), drumMat);
      drum.rotation.x = Math.PI / 2;
      drum.position.set(0, 0.48, 0.635);
      group.add(drum);

      const glowMat = new THREE.MeshLambertMaterial({ color: GLOW_COLORS[status], transparent: true, opacity: status === 'available' ? 0.35 : 0.75 });
      const glowDisc = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.01, 20), glowMat);
      glowDisc.rotation.x = Math.PI / 2;
      glowDisc.position.set(0, 0.48, 0.645);
      group.add(glowDisc);

      const btnColors = [0x00A878, 0x4F8EF7, 0xD97706];
      btnColors.forEach((bc, bi) => {
        const btn = new THREE.Mesh(
          new THREE.CylinderGeometry(0.04, 0.04, 0.02, 8),
          new THREE.MeshLambertMaterial({ color: bc })
        );
        btn.rotation.x = Math.PI / 2;
        btn.position.set(0.42 - bi * 0.14, 0.78, 0.615);
        group.add(btn);
      });

      const ledMat = new THREE.MeshLambertMaterial({ color: GLOW_COLORS[status], emissive: GLOW_COLORS[status], emissiveIntensity: 0.8 });
      const led = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 8), ledMat);
      led.position.set(-0.45, 0.82, 0.615);
      group.add(led);

      const pointLight = new THREE.PointLight(GLOW_COLORS[status], status === 'in-use' ? 0.8 : 0.2, 2.5);
      pointLight.position.set(0, 0.5, 0.8);
      group.add(pointLight);

      const cardAnchor = new THREE.Object3D();
      cardAnchor.position.set(0, 1.55, 0);
      group.add(cardAnchor);

      scene.add(group);
      machines[id] = { group, drum, glowDisc, led, ledMat, glowMat, stripMat, strip, pointLight, status, cardAnchor, baseY: group.position.y };
    });

    sceneRef.current = { renderer, scene, camera, machines, posterMesh, scanMesh, posterBounds: { posterW, posterH } };

    // ── Animation loop ──
    let frameId;
    let t = 0;
    let scanActive = false, scanStart = 0;
    const posterTopY = 1.3 + posterH/2;
    const posterBotY = 1.3 - posterH/2;

    function startScan() {
      if (scanActive) return;
      scanActive = true;
      scanStart = performance.now();
      scanMesh.visible = true;
      setScanningLabel(true);
    }

    const raycaster = new THREE.Raycaster();
    const ndc = new THREE.Vector2();
    function onCanvasClick(ev) {
      const rect = el.getBoundingClientRect();
      ndc.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
      ndc.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(ndc, camera);
      const hits = raycaster.intersectObject(posterMesh, false);
      if (hits.length > 0) startScan();
    }
    el.addEventListener('click', onCanvasClick);
    function onCanvasMove(ev) {
      const rect = el.getBoundingClientRect();
      ndc.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
      ndc.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(ndc, camera);
      el.style.cursor = raycaster.intersectObject(posterMesh, false).length > 0 ? 'pointer' : 'default';
    }
    el.addEventListener('mousemove', onCanvasMove);

    let lastProjUpdate = 0;
    function animate() {
      frameId = requestAnimationFrame(animate);
      t += 0.016;

      if (scanActive) {
        const elapsed = performance.now() - scanStart;
        const dur = 1150;
        const p = Math.min(1, elapsed / dur);
        scanMesh.position.y = posterTopY - (posterTopY - posterBotY) * p;
        scanMat.opacity = 0.55 * Math.sin(p * Math.PI);
        if (p >= 1) {
          scanActive = false;
          scanMesh.visible = false;
          setScanningLabel(false);
          window.open(LAUNDRY_URL, '_blank', 'noopener');
        }
      }
      Object.entries(machines).forEach(([id, m]) => {
        if (m.status === 'in-use') {
          const hopT = t * 5 + (m.group.position.x + m.group.position.z) * 2;
          const hop = Math.max(0, Math.sin(hopT));
          const hopHeight = hop * hop * 0.16;
          m.group.position.y = m.baseY + hopHeight;
          const squash = 1 - hop * 0.05;
          m.group.scale.set(1 + (1 - squash) * 0.6, squash, 1 + (1 - squash) * 0.6);
          m.pointLight.intensity = 0.6 + Math.sin(t * 3) * 0.3;
          m.ledMat.emissiveIntensity = 0.6 + Math.sin(t * 4) * 0.4;
        } else if (m.status === 'out-of-order') {
          m.pointLight.intensity = 0.15 + Math.sin(t * 1.5) * 0.1;
          m.ledMat.emissiveIntensity = 0.4 + Math.sin(t * 2) * 0.3;
        } else {
          m.group.position.y = m.baseY;
          m.group.scale.set(1, 1, 1);
        }
      });

      renderer.render(scene, camera);

      if (t - lastProjUpdate > 0.05) {
        lastProjUpdate = t;
        const rect = el.getBoundingClientRect();
        const positions = {};
        Object.entries(machines).forEach(([id, m]) => {
          const worldPos = new THREE.Vector3();
          m.cardAnchor.getWorldPosition(worldPos);
          const projected = worldPos.clone().project(camera);
          positions[id] = {
            x: (projected.x * 0.5 + 0.5) * rect.width,
            y: (-projected.y * 0.5 + 0.5) * rect.height,
          };
        });
        setCardPositions(positions);
      }
    }
    animate();

    function onResize() {
      const { w, h } = getSize();
      if (w === 0 || h === 0) return;
      const asp = w / h;
      camera.left = -d * asp; camera.right = d * asp;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
    }
    const resizeObserver = new ResizeObserver(onResize);
    resizeObserver.observe(el);
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', onResize);
    const settleTimer = setTimeout(onResize, 150);

    return () => {
      cancelAnimationFrame(frameId);
      clearTimeout(settleTimer);
      resizeObserver.disconnect();
      window.removeEventListener('resize', onResize);
      window.removeEventListener('orientationchange', onResize);
      el.removeEventListener('click', onCanvasClick);
      el.removeEventListener('mousemove', onCanvasMove);
      renderer.dispose();
    };
  }, []);

  useEffect(() => {
    const { machines } = sceneRef.current;
    if (!machines) return;
    LAYOUT.forEach(({ id }) => {
      const m = machines[id];
      if (!m) return;
      const status = getStatus(id);
      if (status === m.status) return;
      m.status = status;
      const col  = STATUS_COLORS[status];
      const glow = GLOW_COLORS[status];
      m.stripMat.color.setHex(col);
      m.glowMat.color.setHex(glow);
      m.glowMat.opacity = status === 'available' ? 0.35 : 0.75;
      m.ledMat.color.setHex(glow);
      m.ledMat.emissive.setHex(glow);
      m.pointLight.color.setHex(glow);
      m.pointLight.intensity = status === 'in-use' ? 0.8 : 0.2;
    });
  }, [machineState]);

  return (
    <div className="scene-panel">
      <canvas className="scene-canvas" ref={mountRef}/>
      <div className="scene-title">Laundry Room</div>
      <div className="scene-subtitle">Live view · read-only</div>
      {LAYOUT.map(({ id, label }) => (
        <React.Fragment key={id}>
          <MiniMachineCard
            label={label}
            status={getStatus(id)}
            pos={cardPositions[id]}
          />
          <RingTimerCard
            data={machineState?.[id]}
            pos={cardPositions[id] ? { x: cardPositions[id].x, y: cardPositions[id].y - 34 } : null}
          />
        </React.Fragment>
      ))}
      <div className="scene-legend">
        <div className="legend-item"><div className="legend-dot" style={{background:'#00A878'}}/> Free</div>
        <div className="legend-item"><div className="legend-dot" style={{background:'#E8354A'}}/> In use</div>
        <div className="legend-item"><div className="legend-dot" style={{background:'#D97706'}}/> Out of order</div>
      </div>
      {scanningLabel && (
        <div className="scan-label">
          <span className="scan-label-dot"/>
          Opening laundry app<span className="scan-dots"/>
        </div>
      )}
    </div>
  );
}

// ── Mini ring timer card ──
function RingTimerCard({ data, pos }) {
  const [now, setNow] = useState(Date.now());
  useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);

  if (!pos) return null;

  const { status, endsAt, totalMs } = data || {};
  const isInUse = status === 'in-use' && endsAt && endsAt > now;
  if (!isInUse) return null;

  const remaining = Math.max(0, endsAt - now);
  const pct = totalMs && remaining > 0 ? remaining / totalMs : 0;

  const fmtTime = ms => {
    if (ms <= 0) return '0:00';
    const s = Math.ceil(ms / 1000);
    return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  };

  const r = 16, cx = 18, cy = 18, circ = 2 * Math.PI * r;

  return (
    <div
      className="ring-card"
      style={{ left: pos.x, top: pos.y }}
    >
      <div className="ring-card-ring">
        <svg width="29" height="29" viewBox="0 0 36 36">
          <circle className="ring-card-bg" cx={cx} cy={cy} r={r}/>
          <circle className="ring-card-progress" cx={cx} cy={cy} r={r}
            strokeDasharray={circ} strokeDashoffset={circ * (1 - pct)}/>
        </svg>
        <div className="ring-card-pct">{Math.round(pct * 100)}%</div>
      </div>
      <div className="ring-card-info">
        <span className="ring-card-label">Time left</span>
        <span className="ring-card-value">{fmtTime(remaining)}</span>
      </div>
    </div>
  );
}

// ── User Weekly History panel ──
// Derived entirely from the analytics/users/{date}/{userId} records already in
// state (usersByDate) plus the excludedUsers set. No new listeners, no writes.
// Each week is bucketed Monday→Sunday; a user's "first ever seen" date decides
// whether a visit in a given week counts as New or Returning.
function WeeklyHistory({ usersByDate, excludedSet }) {
  const WEEKS = 8;
  const weeks = getLastNWeeks(WEEKS);
  const thisWeekKey = weeks[weeks.length - 1].key;

  // First-ever-seen date per user (chronological scan, excluded devices skipped).
  const firstSeen = {};
  Object.keys(usersByDate || {}).sort().forEach(date => {
    Object.keys(usersByDate[date] || {}).forEach(u => {
      if (excludedSet.has(u)) return;
      if (!(u in firstSeen)) firstSeen[u] = date;
    });
  });

  // For each week, collect the unique users active in it, split New vs Returning.
  const weekData = weeks.map(w => {
    const users = new Set();
    Object.keys(usersByDate || {}).forEach(date => {
      const dk = mondayKeyOf(parseDateKey(date));
      if (dk !== w.key) return;
      Object.keys(usersByDate[date] || {}).forEach(u => {
        if (!excludedSet.has(u)) users.add(u);
      });
    });
    let nw = 0;
    users.forEach(u => {
      // New if the user's first-ever-seen date falls inside this week.
      if (firstSeen[u] && mondayKeyOf(parseDateKey(firstSeen[u])) === w.key) nw++;
    });
    const total = users.size;
    return { ...w, total, nw, ret: total - nw, isNow: w.key === thisWeekKey };
  });

  // Hide empty leading weeks — only show from the first week that had any
  // activity onward. The current (in-progress) week is always kept so a fresh
  // week still appears. Keeps a young app from showing blank columns.
  const firstActive = weekData.findIndex(w => w.total > 0);
  const startIdx = firstActive === -1 ? weekData.length - 1 : firstActive;
  const visibleWeeks = weekData.slice(startIdx);

  const maxTotal = Math.max(1, ...visibleWeeks.map(w => w.total));

  // Return-rate trend: % of a week's users who were returning (not first-timers).
  const rate = w => (w.total ? Math.round((w.ret / w.total) * 100) : 0);
  const completed = visibleWeeks.filter(w => !w.isNow);
  const thisWeek = visibleWeeks[visibleWeeks.length - 1];
  const lastWeek = completed[completed.length - 1];
  const thisRate = rate(thisWeek);
  const lastRate = lastWeek ? rate(lastWeek) : 0;
  const deltaPts = thisRate - lastRate;

  return (
    <div className="panel">
      <div className="panel-title-row">
        <div className="panel-title">User Weekly History</div>
        <span className="panel-note">{visibleWeeks.length === 1 ? 'this week' : `${visibleWeeks.length} weeks`}</span>
      </div>

      <div className="wk-chart">
        {visibleWeeks.map(w => {
          const stackH = (w.total / maxTotal) * 100;
          const newH = w.total ? (w.nw / w.total) * 100 : 0;
          const retH = w.total ? (w.ret / w.total) * 100 : 0;
          return (
            <div className={`wk-col${w.isNow ? ' now' : ''}`} key={w.key}>
              <span className="wk-total">{w.total}</span>
              <div className="wk-stack" style={{ height: `${stackH}%` }}>
                <div className="wk-new" style={{ height: `${newH}%` }}/>
                <div className="wk-ret" style={{ height: `${retH}%` }}/>
              </div>
            </div>
          );
        })}
      </div>

      <div className="wk-axis">
        {visibleWeeks.map(w => <span key={w.key}>{w.label}</span>)}
      </div>

      <div className="stack-legend">
        <div className="legend-item"><div className="legend-dot" style={{background:'#C2C8D6'}}/> Returning</div>
        <div className="legend-item"><div className="legend-dot" style={{background:'#00A878'}}/> New</div>
        <div className="legend-item"><div className="legend-dot" style={{background:'#C2C8D6', opacity:0.45}}/> In progress</div>
      </div>

      <div className="users-footer">
        <div>
          <div className="users-footer-hero">{thisRate}<span>%</span></div>
          <div className="users-footer-label">came back this week</div>
        </div>
        <div className="users-footer-divider"/>
        <div>
          <div className={`users-footer-alt ${deltaPts > 0 ? 'up' : ''}`} style={deltaPts > 0 ? {color:'var(--green)'} : {}}>
            {deltaPts > 0 ? '+' : deltaPts < 0 ? '−' : ''}{Math.abs(deltaPts)}
          </div>
          <div className="users-footer-label">pts vs last week</div>
        </div>
      </div>
    </div>
  );
}

// ── Main dashboard ──
function Dashboard() {
  const [data,       setData]       = useState({ totals: {}, daily: {}, hourlyAll: {}, feedbacks: [], machines: null, usersByDate: {}, excluded: {} });
  const [loading,    setLoading]    = useState(true);
  const [lastUpdate, setLastUpdate] = useState(null);

  useEffect(() => {
    const unsubs = [];

    const listen = (path, apply) => {
      const unsubscribe = fbOnValue(fbRef(fbDb, path), snap => {
        apply(snap.exists() ? snap.val() : null);
        setLastUpdate(Date.now());
      }, err => console.error(`Listener failed for ${path}`, err));
      unsubs.push(unsubscribe);
    };

    listen('machines', v => {
      setData(d => ({ ...d, machines: v || {} }));
      setLoading(false);
    });
    listen('analytics/totals', v => setData(d => ({ ...d, totals: v || {} })));
    listen('analytics/daily',  v => setData(d => ({ ...d, daily:  v || {} })));
    listen('analytics/users', v => setData(d => ({ ...d, usersByDate: v || {} })));
    listen('excludedUsers',   v => setData(d => ({ ...d, excluded:   v || {} })));
    listen('analytics/hourly', v => setData(d => ({ ...d, hourlyAll: v || {} })));
    listen('feedback', v => setData(d => ({
      ...d,
      feedbacks: v ? Object.values(v).sort((a, b) => b.ts - a.ts) : [],
    })));

    return () => unsubs.forEach(fn => fn && fn());
  }, []);

  if (loading) return (
    <div className="loading-screen"><div className="spinner"/><span>Loading dashboard…</span></div>
  );

  const { totals, daily, hourlyAll, feedbacks, machines, usersByDate, excluded } = data;
  const hourly = hourlyAll?.[getTodayKey()] || {};
  const days7  = getLast7Days();

  const excludedSet = new Set(Object.keys(excluded || {}));

              {Array.from({length:24}, (_,i) => (
                <div className="heat-label" key={i}>
                  {i % 6 === 0 ? `${i}h` : ''}
                </div>
              ))}
            </div>
            <div style={{marginTop: 20}}>
              <div style={{display:'flex', justifyContent:'space-between', marginBottom: 8}}>
                <span style={{fontSize:12, color:'var(--text-mid)', fontWeight:600}}>Today's cycles</span>
                <span style={{fontFamily:'var(--mono)', fontSize:12, color:'var(--text-dim)'}}>{todayCycles} started</span>
              </div>
              {['washer','dryer'].map(t => {
                const c = daily?.[getTodayKey()]?.[`cycles_${t}`] || 0;
                return (
                  <div className="bar-row" key={t} style={{marginBottom:6}}>
                    <div className="bar-day" style={{width:42}}>{t === 'washer' ? 'Wash' : 'Dry'}</div>
                    <div className="bar-track">
                      <div className="bar-fill" style={{width:`${todayCycles > 0 ? (c/todayCycles)*100 : 0}%`, background:'linear-gradient(90deg,#4F8EF7,#74AAFF)'}}/>
                    </div>
                    <div className="bar-val">{c}</div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>

        {/* ── User Weekly History ── */}
        <div>
          <WeeklyHistory usersByDate={usersByDate} excludedSet={excludedSet}/>
        </div>

        {/* ── Feedback row ── */}
        <div className="mid-row">

          {/* Rating summary */}
          <div className="panel">
            <div className="panel-title">Ratings</div>
            {feedbacks.length === 0 ? (
              <div className="empty-state">
                <div className="empty-icon">⭐</div>
                No ratings yet
              </div>
            ) : (
              <>
                <div className="avg-score-wrap">
                  <div className="avg-score-num">{avg || '—'}</div>
                  <div className="avg-score-stars">{avg ? '★'.repeat(Math.round(avg)) + '☆'.repeat(5-Math.round(avg)) : ''}</div>
                  <div className="avg-score-sub">{feedbacks.filter(f=>f.rating>0).length} ratings</div>
                </div>
                <div className="rating-bars">
                  {ratingCounts.map(({r, count}) => (
                    <div className="rating-row" key={r}>
                      <div className="rating-label">{'★'.repeat(r)}</div>
                      <div className="rating-track">
                        <div className="rating-fill" style={{width:`${(count/maxRatingCount)*100}%`}}/>
                      </div>
                      <div className="rating-count">{count}</div>
                    </div>
                  ))}
                </div>
              </>
            )}
          </div>

          {/* Feedback messages */}
          <div className="panel" style={{maxHeight: 480, overflowY: 'auto'}}>
            <div className="panel-title">Feedback messages</div>
            {feedbacks.length === 0 ? (
              <div className="empty-state">
                <div className="empty-icon">💬</div>
                No feedback yet
              </div>
            ) : (
              <div className="feedback-list">
                {feedbacks.map((f, i) => (
                  <div className="feedback-item" key={i}>
                    <div className="feedback-header">
                      <span className="feedback-stars-display">{starStr(f.rating)}</span>
                      <span className="feedback-meta">{fmtDate(f.ts)}</span>
                    </div>
                    {f.message
                      ? <div className="feedback-message">{f.message}</div>
                      : <div className="feedback-no-msg">No message</div>
                    }
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>

      </div>
    </>
  );
}

// ── Root ──
function App() {
  const [fbReady, setFbReady] = useState(false);

  useEffect(() => {
    initFirebase().then(() => setFbReady(true)).catch(console.error);
  }, []);

  if (!fbReady) return <div className="loading-screen"><div className="spinner"/><span>Initialising…</span></div>;
  return <Dashboard />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
